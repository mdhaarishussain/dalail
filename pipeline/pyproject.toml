[project]
name = "dalail-pipeline"
version = "0.0.0"
description = "Validate the Dalail corpus, embed it and build the read-only SQLite DB shipped in the app."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6",
    "jsonschema>=4.22",
    "sqlite-vec==0.1.7",
]

[project.optional-dependencies]
# Needed only for `embed` / `build` with vectors. Compiles llama.cpp (CPU) on install.
embed = ["llama-cpp-python==0.3.36"]
# Developer-only speech-to-text for research/munazara (downloads a ~3.1 GB model once).
transcribe = ["faster-whisper==1.2.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dalail_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_model: requires models/ GGUF and the embed extra (skipped otherwise)"]

[tool.ruff]
line-length = 120
extend-exclude = ["tools"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
