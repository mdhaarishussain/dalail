[project]
name = "dalail-pipeline"
version = "0.0.0"
description = "Validate the Dalail corpus, embed it and build the read-only SQLite DB shipped in the app."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
]
# Phase 1 adds: llama-cpp-python (e5 GGUF embeddings, CPU-only), sqlite-vec.

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dalail_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
