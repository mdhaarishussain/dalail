source_id: yt-VjNHXpkh5us
video_title: "Defending Tawassul (4): The Truth About the Dead and the Absent!"
playlist_index: 30
moves:
  - id: M01
    timestamp: "00:03:55"
    speaker: S
    claim_ref: C01
    quote: "Tawassul is seeking a means, and in particular we mean the practice, the Islamic practice of asking Allah, asking God alone, not for—sorry, by a prophet of His, or by a noble high-ranking saint, pious Muslim, waliyy, or by anything else that's good."
    summary_en: "Defines tawassul as asking Allah alone by the status of a prophet, saint, good deed, or noble creation."
  - id: M02
    timestamp: "00:06:40"
    speaker: S
    claim_ref: C02
    quote: "So one of them said to the others, \"There is no way except for us to ask Allah by some good deeds that we have done.\" So each one made supplication by a good deed that he did, and each one told his story."
    summary_en: "Cites the Hadith of the Three Men trapped in the cave as proof of tawassul by righteous deeds."
  - id: M03
    timestamp: "00:16:47"
    speaker: S
    claim_ref: C03
    quote: "The Wahhabi said that it is not permissible to call someone who is not alive or is absent because they do not hear. \"The dead one, he doesn't hear,\" they say, \"and the absent one, he can't hear you.\""
    summary_en: "Summarizes the Wahhabi argument that calling the dead or absent is shirk because they cannot hear."
  - id: M04
    timestamp: "00:18:17"
    speaker: S
    debate_tip_ref: T01
    quote: "So if they think that you are a pagan, polytheist, mushrik person, you know—well, you know what they do. So they might turn around and say, \"Well, then your blood is lawful, and your money is lawful,\" and things like that. So we don't want them miseducating people about our religion, misguiding people."
    summary_en: "Explains why debating this issue is essential: Wahhabi takfir leads to extremism and making Muslim life and wealth lawful."
  - id: M05
    timestamp: "00:21:32"
    speaker: S
    claim_ref: C04
    counter_question_ref: Q01
    quote: "So Ibrahim stood upon the stone and said, \"O people, Hajj has been made obligatory upon you.\" He made those who are in the spines of the men as seminal fluid and the wombs of the women hear. That's what's in the hadith. He made those who are in the spines of the men and the wombs of the women hear."
    summary_en: "Cites the narration of Ibn Abbas that Prophet Ibrahim called the unborn to Hajj from the stone, refuting the claim that the absent cannot hear."
  - id: M06
    timestamp: "00:24:06"
    speaker: S
    counter_question_ref: Q01
    quote: "Is not Islam supposed to be the religion of Abraham? It seems the Wahhabiyyah know better, because that is a second reason why Prophet Ibrahim is a mushrik in their religion. This is supposed to be the religion of Abraham, and we see that what Abraham did is blasphemy according to the Wahhabis."
    summary_en: "Highlights the absurd implication of the Wahhabi rule: Prophet Ibrahim calling the absent would make him a mushrik by their criteria."
  - id: M07
    timestamp: "00:25:59"
    speaker: S
    claim_ref: C05
    quote: "He dissected them, he slaughtered them and he dissected them, he cut them into pieces. Then he distributed their pieces on mountains, and then he stood in the middle between all those mountains, and then he called those dead birds. He called the dead, that's what the Wahhabis call it, calling the dead."
    summary_en: "Cites the Qur'anic miracle of Prophet Ibrahim calling the slaughtered birds, directly demonstrating calling the dead."
  - id: M08
    timestamp: "00:28:07"
    speaker: S
    debate_tip_ref: T02
    quote: "So question: What if the Wahhabi excuses Abraham by saying, \"But he was a prophet\"? Say: Then you are going back on your invalid rule like you did the last time, that those who are not alive or who are far cannot hear. You did not say, \"Unless the one who calls them is a prophet,\" nor do you believe that also."
    summary_en: "Preempts the Wahhabi ad-hoc defense that Ibrahim was a prophet by pointing out they never qualified their universal rule."
  - id: M09
    timestamp: "00:29:06"
    speaker: S
    debate_tip_ref: T03
    quote: "The religious rule is that an exception, to be valid, needs to be connected to the statement. It needs to be connected to the statement. So that if someone says, \"The people came,\" and then the next day he says, \"Except Zayd,\" that's not valid."
    summary_en: "Applies the legal linguistic rule that an exception (istithna') must be connected; disconnected retroactive exceptions are invalid."
  - id: M10
    timestamp: "00:31:23"
    speaker: S
    counter_question_ref: Q02
    debate_tip_ref: T04
    quote: "So we pose a question wanting only a yes or no answer: Is it a condition that the one who hears be alive and present? He must say no. He has to. But what he will probably do here, he probably will shut down and say, \"I don't want to talk to you anymore.\""
    summary_en: "Recommends pinning the opponent with a closed yes/no question on whether hearing strictly requires being alive and present."
  - id: M11
    timestamp: "00:32:53"
    speaker: S
    claim_ref: C06
    quote: "then what about what is confirmed about 'Umar ibn al-Khattab, who is not a prophet, giving a speech in Madinah, then suddenly interrupting himself to call out to Sariyah, the commander of the army in Persia? He said: [ARABIC RECITATION: Umar calling Sariyah from the minbar] phrase_as_heard: \"ya sariyah al-jabal al-jabal\" \"Take the mountain, take the mountain!\""
    summary_en: "Cites 'Umar calling his commander Sariyah in Persia from the minbar in Madinah as an authentic proof that non-prophets can address the absent."
  - id: M12
    timestamp: "00:35:23"
    speaker: S
    counter_question_ref: Q03
    quote: "So if calling someone depends on him being alive and present, or else it is blasphemy, worship of other than Allah, then to the Wahhabis, along with Adam, Ibn 'Abbas, Prophet Muhammad, the four imams, Ibrahim the messenger of Allah, 'Umar is also a mushrik too."
    summary_en: "Summarizes the reductio ad absurdum: under the Wahhabi definition, Adam, Ibn 'Abbas, the Prophet, the Four Imams, Ibrahim, and 'Umar would all be mushriks."
  - id: M13
    timestamp: "00:37:35"
    speaker: S
    claim_ref: C07
    quote: "Ibn 'Abbas, he taught the people. He said: Indeed Allah has angels who roam the earth, other than the angels who write down the deeds of the human beings. These angels document the leaves that fall. And if any of you were in an open land and some difficulty came upon him, then let him call out: [ARABIC RECITATION: Athar of Ibn Abbas on calling for help] phrase_as_heard: \"a'inu 'ibadallah\" \"Help, O slaves of Allah!\""
    summary_en: "Cites the athar of Ibn 'Abbas instructing believers in the desert to call upon unseen, absent servants of Allah for assistance."
  - id: M14
    timestamp: "00:41:24"
    speaker: S
    claim_ref: C08
    quote: "The four imams, each one of them, they documented that it is said in the tashahhud for the prayer: [ARABIC RECITATION: Tashahhud greeting to the Prophet] phrase_as_heard: \"as-salamu 'alayka ayyuhan-nabiyyu\" \"Peace be upon you, O Prophet!\" And the Prophet already passed away. So then the four imams would have to be mushriks."
    summary_en: "Points out that all four Sunni imams mandate addressing the deceased Prophet in the daily prayer tashahhud."
  - id: M15
    timestamp: "00:44:12"
    speaker: S
    claim_ref: C09
    quote: "There is not one of you that passes by the grave of his fellow believer that he used to know in the dunya—the dunya is the worldly life, the earthly life that we live in now—there is not one of you that passes by the grave of his fellow believer that he knew in the dunya and gives him the salam—so he gives salam to a dead person, he's talking to a dead person—except that he, the dead one, would know him, he would hear him, he would recognize his voice, he would be aware, and he would return his salam."
    summary_en: "Cites the hadith narrated by Ibn 'Abd al-Barr proving that the deceased in the grave hears, recognizes, and answers the living who greet him."
  - id: M16
    timestamp: "00:45:27"
    speaker: S
    claim_ref: C10
    quote: "Certainly the slave, when he is put in his grave, the slave of God, when he is put in his grave and his companions turn away from him, his people who buried him, he will surely hear the steps of their sandals as they leave. [ARABIC RECITATION: Footsteps hadith continued] phrase_as_heard: \"innahu layasma'u qar'a ni'alihim\" And surely he certainly hears the hit of their sandals, means their footsteps, he can hear their footsteps as they leave."
    summary_en: "Cites the authentic hadith in Bukhari and Muslim confirming that the deceased hears the footsteps of the burying party leaving."
  - id: M17
    timestamp: "00:46:48"
    speaker: S
    claim_ref: C11
    quote: "It does not mean that the dead cannot hear. This verse does not mean that the dead cannot hear, because there are several pieces of evidence proving that the dead do hear, like what was just mentioned. It doesn't mean that the dead don't hear, rather the verse is likening those who were not listening to the Prophet. He was calling them to Islam and teaching them, and they wouldn't respond. So Allah told him, \"Muhammad, you cannot make the dead hear.\""
    summary_en: "Explains that Surah an-Naml: 80 likens obstinate living unbelievers to the dead metaphorically, rather than denying the hearing of the deceased."
  - id: M18
    timestamp: "00:49:39"
    speaker: S
    claim_ref: C12
    quote: "Also the incident when the Prophet, sallallahu 'alayhi wa sallam, said to the casualties of the Battle of Badr, the casualties of the Battle of Badr, he said to them—they were dead people, he said to them: [ARABIC RECITATION: Prophet addressing the dead at Badr] phrase_as_heard: \"hal wajadtum ma wa'ada rabbukum haqqa\" \"Have you found what your Lord promised you to be true?\" It was then said to the Prophet, sallallahu 'alayhi wa sallam: \"O Messenger of Allah, do you call the dead?\" It's right in the hadith. He responded: [ARABIC RECITATION: Prophet's response to the Sahabah at Badr] phrase_as_heard: \"ma antum bi-asma'a lima aqulu minhum\" He said: \"You do not hear better than they do, however they do not answer.\""
    summary_en: "Cites the Prophet addressing the corpses of the pagans in the pit of Badr and explicitly confirming they hear his words as well as the living."
  - id: M19
    timestamp: "00:50:26"
    speaker: S
    claim_ref: C13
    quote: "You should know that the prophets are alive in their graves and their bodies do not decay. It was narrated in the hadith of Anas from the Prophet, sallallahu 'alayhi wa sallam: [ARABIC RECITATION: Hadith on the Prophets alive in their graves] phrase_as_heard: \"al-anbiya'u ahya'un fi quburihim yusallun\" \"The prophets are alive in their graves praying.\" Al-Bayhaqi deemed it authentic, and Hafidh Ibn Hajar al-'Asqalani agreed with him."
    summary_en: "Cites the authentic hadith that prophets are alive in their graves praying, showing their Barzakh life is active and conscious."
  - id: M20
    timestamp: "00:50:53"
    speaker: S
    debate_tip_ref: T05
    quote: "You should also know that the Wahhabi conviction about the Prophet, sallallahu 'alayhi wa sallam, is that he loses his status after death, and for that reason many of them insult the Prophet, sallallahu 'alayhi wa sallam. A corpse—they say: \"Why are you calling on a corpse?\" Or they say that a stick is more useful than him! Literally they say that."
    summary_en: "Exposes the underlying Wahhabi motive: reducing the Prophet's status to 'a corpse' or claiming 'a stick is more useful than him' to justify their ban on tawassul."
