counter_questions:
  - id: Q01
    question: "If calling the absent or unborn is shirk because they cannot hear, was Prophet Ibrahim committing blasphemy when he called the unborn generations to Hajj from the stone?"
    target_claim: C03
    purpose: "Forces the opponent to choose between retracting their universal shirk rule or blaspheming against Prophet Ibrahim."
  - id: Q02
    question: "Is it an absolute condition in Islamic law that the one who hears must be alive and present before you, yes or no?"
    target_claim: C03
    purpose: "Pins the opponent to a strict binary dilemma that collapses their hearing-based definition of shirk."
  - id: Q03
    question: "If addressing someone dead or absent is worship of other than Allah, are Adam, Ibn 'Abbas, the Prophet, the Four Imams, and 'Umar all guilty of shirk under your definition?"
    target_claim: C03
    purpose: "Drives a comprehensive reductio ad absurdum demonstrating that Wahhabi takfir encompasses the entire Islamic tradition."
debate_tips:
  - id: T01
    tip: "Explain the real-world danger of takfir: Wahhabi extremists use accusations of shirk to justify bloodshed and confiscation of Muslim wealth, which makes dismantling their premise an urgent religious obligation."
    category: strategic-context
  - id: T02
    tip: "Refuse ad-hoc retroactive exceptions: when an opponent claims 'that was only for a prophet,' point out that their original definition claimed the act itself is inherently shirk, and an act of shirk can never be lawful for a prophet."
    category: counter-tactic
  - id: T03
    tip: "Enforce linguistic and legal consistency: an exception (istithna') must be connected (muttasil) to the original statement. A disconnected exception (munqati') invented after being refuted is legally invalid."
    category: linguistic-logic
  - id: T04
    tip: "Demand strict binary yes/no answers on foundational premises before allowing the opponent to pivot or introduce distraction ayat."
    category: cross-examination
  - id: T05
    tip: "Expose double standards: Wahhabis degrade the Prophet as 'a corpse' or claim 'a walking stick is more useful than him,' yet they would never tolerate such disrespectful language directed at Ibn Taymiyyah."
    category: rhetorical-exposure
