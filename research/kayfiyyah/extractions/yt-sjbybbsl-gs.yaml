video_title: "Questions, Answers and Pointers in Debate (Part 2: History of Wahhabism/God Existing Without Place)"
playlist_index: 35
moves:
  - id: M01
    timestamp: "00:02:51"
    speaker: S
    debate_tip_ref: T01
    quote: "Didn't we say that one of the things that you have to base your debate on is actually an agreement, not a disagreement? You can't argue with somebody based on a disagreement; you have to agree with him somewhere so that you can refer back to that point that you agree about."
    summary_en: "Explains that debates must be grounded on shared premises rather than points of contention."
  - id: M02
    timestamp: "00:06:46"
    speaker: S
    claim_ref: C01
    quote: "This is a claim from the perspective of looking at the Muslims as deviants. Ya'ni to claim that you're calling people back to the way of the Salaf, that's to imply that they left the way of the Salaf, so you're calling the Muslims deviants!"
    summary_en: "Exposes the premise of calling people back to the Salaf as an implicit accusation that the entire Ummah apostatized or deviated."
  - id: M03
    timestamp: "00:07:14"
    speaker: S
    counter_question_ref: Q01
    quote: "Where did he get that correct belief from if he didn't get it from the Muslims at his time? Since he was not following the Muslims of his time, then either—how would he know what's right, and he's not following the Muslims of his time? Then either he was a prophet who got revelation and he knew what no one else did, that's how he knew how to call people back, and that's surely impossible, or else he's the one who's a deviant!"
    summary_en: "Constructs the dilemma of Muhammad ibn 'Abd al-Wahhab: he was either an inspired prophet or a sectarian innovator."
  - id: M04
    timestamp: "00:08:29"
    speaker: S
    counter_question_ref: Q02
    quote: "So if he's correct, then the Muslims have been wrong for a thousand years, and he's not following the Salaf then—if that's the case, he would be correcting the Salaf! And if he's wrong, then he's the mischievous one who's perverting the hadith science, and he's still not following the Salaf."
    summary_en: "Applies the same historical dilemma to al-Albani's contemporary re-grading of classical hadiths."
  - id: M05
    timestamp: "00:09:03"
    speaker: S
    claim_ref: C02
    quote: "Yes, the Muslims are now weak and sinful, but they are not deviants. When we say deviant, that means wrong belief. So the Muslims, they don't need to be called back to tawhid, because they never left it! They don't need to be called back to the way of the Salaf in their creed; they never left that. They just need to learn properly."
    summary_en: "Distinguishes between moral weakness/sinfulness and doctrinal apostasy, asserting the Ummah never lost tawhid."
  - id: M06
    timestamp: "00:10:12"
    speaker: S
    claim_ref: C03
    quote: "\"There does not cease to be a group from my nation that is obviously upon the truth; those who oppose them will not harm them, until comes the command of Allah,\" which is Judgment Day. So that's our answer. Someone says, \"We call ourselves Salafis because we're calling people back to the way of the Salaf.\" So you're saying the Muslims are deviants, and that's what they believe, actually."
    summary_en: "Cites the Hadith of the Victorious Group proving the true creed was continuously preserved and never vanished."
  - id: M07
    timestamp: "00:12:27"
    speaker: S
    claim_ref: C04
    quote: "So I told him: There's the book of his own brother, Sheikh Sulayman. He has more than one book, actually, in which he refuted his own brother, and he has a book called: [ARABIC RECITATION: Title of Sheikh Sulayman's book] phrase_as_heard: \"as-sawa'iqul-ilahiyyah fir-raddi 'alal-wahhabiyyah\" The Divine Bolts in Refuting the Wahhabis. That's Muhammad's own brother calling his brother and his brother's followers Wahhabis! So that's what the Muslims call them."
    summary_en: "Cites Sheikh Sulayman ibn 'Abd al-Wahhab's classical refutation as proof that the movement was named Wahhabiyyah by their own family and scholars."
  - id: M08
    timestamp: "00:14:43"
    speaker: S
    claim_ref: C05
    quote: "Which is what? That Ibn Taymiyyah was a deviant person at his time. He wasn't envied by the scholars: they imprisoned him for deviant sayings on numerous occasions, they left him in prison to die, they burned his books, and also they washed his books, they rinsed his books, because the ink in those days would run off of the page."
    summary_en: "Highlights the classical historical consensus against Ibn Taymiyyah: imprisonment, banning of fatwas, and rinsing of manuscripts."
  - id: M09
    timestamp: "00:17:23"
    speaker: S
    claim_ref: C06
    quote: "So for a group that claims to wage war against innovations and to be revivers of the manhaj of old, how do they accept to give themselves a name that no one in history had, and deem everyone other than themselves as deviants, and not see a contradiction in that?"
    summary_en: "Points out the self-contradiction of anti-innovation polemicists adopting an unprecedented sectarian moniker."
  - id: M10
    timestamp: "00:17:57"
    speaker: S
    claim_ref: C07
    quote: "Because they do not know the history of how those who currently call themselves Salafis aligned themselves with the non-Muslims to fight the Muslims and overthrow the country unjustly, as if it was always called Saudi Arabia! In other words, to them, they don't know what country the Prophet was from: \"Oh, he was from Saudi Arabia.\" No, it's just Arabia. The Prophet's land was called Jazirat al-'Arab, the Arabian Peninsula."
    summary_en: "Exposes the modern geopolitical origin of the Saudi state through alliance with colonial powers against the Ottomans."
  - id: M11
    timestamp: "00:19:33"
    speaker: S
    claim_ref: C08
    quote: "How could it be obligatory to follow Ibn Taymiyyah when the Prophet, sallallahu 'alayhi wa sallam, said: [ARABIC RECITATION: Athar of Ibn Abbas / Malik] phrase_as_heard: \"kullu ahadin yu'khadhu min qawlihi wa yuradd illa rasulullah\" \"There is none of you but that his statements are accepted and rejected, except the Messenger of Allah\"? This means that the only one from whom we must take all of his statements is the Messenger of Allah. It's permissible to not take the statement of someone other than the Prophet."
    summary_en: "Cites the principle that only the Prophet's words are entirely binding, refuting the elevation of Ibn Taymiyyah."
  - id: M12
    timestamp: "00:21:07"
    speaker: S
    debate_tip_ref: T02
    quote: "So that's a tactic there, that's just a tactic to open a door. That's a way to shift the conversation the way we want it to go. So if you recognize that tactic, you don't let someone do that to you. You don't let him take the conversation the way he wants it to go; you keep the conversation the way you want it to go."
    summary_en: "Explains the debate tactic of baiting an opponent with an extreme premise to steer the discussion."
  - id: M13
    timestamp: "00:24:41"
    speaker: S
    claim_ref: C09
    quote: "The Salaf of this nation are a part of Ahl al-Sunnah. Ahl al-Sunnah includes the companions and those who follow them, and they are the majority of the nation, the majority of all who are ascribed to Islam or affiliated with Islam. In general, the greatest authorities of Ahl al-Sunnah are the Salaf, who are the first three generations, or the first three centuries—you can say it this way or that way. The people of Ahl al-Sunnah after the Salaf are called the Khalaf, not the Salafis."
    summary_en: "Defines the historical taxonomy: Salaf and Khalaf are chronological eras of Ahl al-Sunnah, not rival sectarian labels."
  - id: M14
    timestamp: "00:27:32"
    speaker: S
    claim_ref: C10
    quote: "This is the correct creed taken from the Book, the Sunnah, and the sound mind, and the Salaf certainly repeated it and they verified it. It means that Allah is not existing in any place. All directions, including above, do not pertain to Him. He does not fill a space. He is not a body with dimensions and volume, and this does not mean that He is everywhere."
    summary_en: "Articulates the Sunni creed of divine transcendence: Allah exists without place, direction, or spatial dimensions."
  - id: M15
    timestamp: "00:28:11"
    speaker: S
    claim_ref: C11
    quote: "Nowhere means not in any place. He existed before He created places, and therefore He was not anywhere before He created places. There was no \"where\" for Him to be. This means that He was not above or below before He created them, before He created up, down, left, right, front, and behind. He existed, and there was literally nowhere."
    summary_en: "Refutes the 'nowhere' trap by explaining that Allah existed before the creation of space, directions, and 'where'."
  - id: M16
    timestamp: "00:28:53"
    speaker: S
    debate_tip_ref: T03
    quote: "So when you debate with someone, remember there's two types of questions: open-ended questions and close-ended questions. Close-ended question is what you want in a debate. That means the answer is yes or no, that's it."
    summary_en: "Recommends employing closed-ended questions (yes/no) to pin opponents down in cross-examination."
  - id: M17
    timestamp: "00:32:48"
    speaker: S
    debate_tip_ref: T04
    quote: "So yes, I am saying that Allah is nowhere, meaning existing without being in any place. However, now don't let him get away with that insinuation. If you mean by saying, \"You are saying that Allah is nowhere,\" to belittle what I am saying, then you are belittling what I am saying, and you're changing my statement \"Allah exists without a place\" to \"Allah is nowhere.\" That does not change the fact, and it does not weaken my argument."
    summary_en: "Instructs debaters on confronting rhetorical traps that twist orthodox positions into pejorative slogans."
  - id: M18
    timestamp: "00:36:59"
    speaker: S
    claim_ref: C12
    quote: "You need to understand that aboveness and highness have two meanings: the literal, physical meaning of aboveness or highness, and the figurative meaning of status, greatness, and majesty. So don't be shaken by any reference of aboveness or highness from the religious texts, not from the Qur'an, not from the Sunnah, not from the words of the scholars, because aboveness and highness have two meanings. It's true in Arabic, and it's true in English. As for the literal, physical meaning, that is the impossible meaning, because Allah is not like His creations, as He said: [ARABIC RECITATION: Surah ash-Shura: 11] phrase_as_heard: \"laysa kamithlihi shay'\" \"Nothing is whatsoever like Him.\" So He is not physical, and He is not a body contained and restricted to directions."
    summary_en: "Distinguishes between physical elevation (impossible for God) and elevation of majesty, grounding tanzih in Surah ash-Shura: 11."
  - id: M19
    timestamp: "00:39:31"
    speaker: S
    claim_ref: C13
    quote: "Question: \"But the Salaf said that Allah is where He said He is.\" That's what Wahhabis say. They say: \"Allah is where He said He is, and the Salaf said Allah is where He said He is.\" Answer: Correction: the people who call themselves Salafis say that. Allah never said that He was anywhere."
    summary_en: "Rebuts the Wahhabi slogan 'Allah is where He said He is' by noting that Allah never attributed location to Himself."
  - id: M20
    timestamp: "00:42:28"
    speaker: S
    claim_ref: C14
    counter_question_ref: Q03
    debate_tip_ref: T05
    quote: "So why, by the Lord of the heavens and earth, are you picking and choosing \"above\" and \"high\" to refer only and absolutely, necessarily and definitively to a place and nothing more? And why are you astonished that we did not say it means a place, when you have done the same thing? So that goes back to what I told you last time: most of the times when someone is debating with you, he does exactly what he's accusing you of!"
    summary_en: "Exposes the hypocrisy of anthropomorphists who allegorize ayat of co-presence and nearness while banning figurative interpretation of aboveness."
