counter_questions:
  - id: Q01
    question: "From whom did Muhammad ibn 'Abd al-Wahhab receive his 'pure creed' 200 years ago if all Muslim scholars of his era were allegedly upon polytheism: was he an inspired prophet, or was he himself the deviant innovator?"
    target_claim: C01
    purpose: "Forces the sectarian opponent into an impossible dilemma regarding their historical chain of transmission."
  - id: Q02
    question: "If al-Albani's late 20th-century hadith rulings are correct, does that mean the entire Ummah and its greatest masters of hadith were in error for a thousand years until he corrected them?"
    target_claim: C01
    purpose: "Demonstrates the absurdity of abandoning classical consensus in favor of a solitary modern writer."
  - id: Q03
    question: "Why do you interpret 'He is with you wherever you are' (57:4) and 'closer than the jugular vein' (50:16) non-literally as knowledge, yet insist that 'above' and 'high' must strictly and literally mean a physical spatial location?"
    target_claim: C14
    purpose: "Completely dismantles the opponent's anti-ta'wil posturing by exposing their blatant hermeneutical double standard."
debate_tips:
  - id: T01
    tip: "Anchor debates in points of agreement: an argument cannot progress from divergence alone; establishing shared epistemological premises (like valid sensory observation) allows you to demonstrate your opponent's internal contradictions."
    category: epistemology
  - id: T02
    tip: "Use conversational baiting to control debate direction: raise an extreme implication of your opponent's position so that their denial opens the door for you to present crushing evidence."
    category: steering-tactics
  - id: T03
    tip: "Demand closed-ended (yes/no) answers: in cross-examination, refuse rambling evasions and hold the opponent strictly to direct binary commitments before proceeding."
    category: cross-examination
  - id: T04
    tip: "Expose and deconstruct rhetorical framing: when an opponent rephrases your orthodox theological position ('Allah exists without a place') into a pejorative strawman ('Allah is nowhere'), unmask their attempt to ridicule before reaffirming the truth."
    category: rhetorical-defense
  - id: T05
    tip: "Mirror their hermeneutical method: whenever an opponent accuses Ahl al-Sunnah of 'denying the text' through figurative interpretation (ta'wil), immediately confront them with the texts they themselves interpret figuratively."
    category: counter-polemics
