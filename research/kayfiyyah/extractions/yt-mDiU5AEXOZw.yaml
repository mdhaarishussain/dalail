    kind: response
    reported: false
    answers: DM-WH-K06
    move_type: definition
    quote: "Therefore, the one who understands Arabic understands that when we say Wahhabi, we are not actually attributing those people to al-Wahhab, who is Allah the Exalted. Rather, we are attributing them to Muhammad ibn 'Abd al-Wahhab, or more specifically to the last part of his name, 'Abd al-Wahhab, the slave of al-Wahhab."
    summary_en: "Clarifies that the nisbah 'Wahhabi' grammatically derives from the founder's father's name 'Abd al-Wahhab, not the divine attribute itself."
    evidence_cited: []
    responds_to: M04
    confidence: high

  - move_id: M06
    timestamp: "00:09:02-00:09:20"
    speaker: S
    side: ahl-e-sunnat
    kind: claim
    reported: false
    answers: null
    move_type: support-chain
    quote: "If keeping the first part leads to confusion, the first part of the name is omitted and the second part is kept. Hence, anyone attributed to Muhammad ibn 'Abd al-Wahhab is not called 'Abdi, but Wahhabi. That's the rule in the language."
    summary_en: "Explains the morphological rule in Arabic for genitive compounds (idafah), where dropping the first term ('Abd) avoids ambiguity."
    evidence_cited:
      - as_said: "Rules of an-Nasab in Arabic morphology (Sarf)"
        timestamp: "00:04:30"
    responds_to: null
    confidence: high

  - move_id: M07
    timestamp: "00:09:20-00:09:51"
    speaker: S
    side: ahl-e-sunnat
    kind: claim
    reported: false
    answers: null
    move_type: practice-consensus
    quote: "Like if someone is attributed to 'Abd al-Ashhal or 'Abd al-Qays, he would not be called 'Abdi, rather Ashhali or Qaysi. That's the rule in the language. When making the nasab to the first word of the idafah is confusing or problematic, then they give it to the second part. Likewise, the follower of 'Abd al-Qadir is called Qadiri."
    summary_en: "Provides classical precedents ('Abd al-Ashhal -> Ashhali, 'Abd al-Qays -> Qaysi, 'Abd al-Qadir -> Qadiri) confirming the dropping of 'Abd."
    evidence_cited: []
    responds_to: M06
    confidence: high

