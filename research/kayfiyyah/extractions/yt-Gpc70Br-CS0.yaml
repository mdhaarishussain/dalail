moves:
  - id: "M01"
    speaker: "Knowledge Channel Host"
    timestamp: "00:00:01"
    quote: "those wahabis also forbid the Muslims from reciting Quran over the graves of their dead they have nothing to"
    summary_en: "The speaker notes that Wahhabis forbid Muslims from reciting the Qur'an over the graves of their dead without evidence, motivated only by callousness."
  - id: "M02"
    speaker: "Knowledge Channel Host"
    timestamp: "00:01:00"
    quote: "which way should we turn he'll say turn towards the Caba tell him why would I be worshiping the cabba if I face the Caba so he'll say no tell him then what make you think I'll worship the dead person if I was facing the dead person"
    summary_en: "The speaker presents a counter-argument: if facing the Ka'bah during du'a is not worshiping the Ka'bah, facing the deceased's direction does not constitute worshiping the deceased."
  - id: "M03"
    speaker: "Knowledge Channel Host"
    timestamp: "00:03:29"
    quote: "and his family is here and his friends and loved ones are here his community is here and we are burying him we put the dirt there and now the dirt is over his grave and now we're going to raise our hands and make Dua you're the only person who thought somebody's even worshiping the dead person"
    summary_en: "The speaker emphasizes that mourners naturally stand facing the grave after burial to make du'a, and only a paranoid accuser imagines they are worshiping the deceased."
  - id: "M04"
    speaker: "Knowledge Channel Host"
    timestamp: "00:01:40"
    quote: "the dead benefit from the supplication of the living and the dead benefit from the Charities of the living given on behalf of the dead"
    summary_en: "The speaker cites scholarly consensus and Imam at-Tahawi's creed that the deceased benefit from the prayers and charities of the living."
  - id: "M05"
    speaker: "Knowledge Channel Host"
    timestamp: "00:04:20"
    quote: "it is recommended for the one who visits the graves to recite what is easy for him of the Quran yeah recites something of the Quran that's easy. for him and then when he feels like he wants to stop he stops and to supplicate for him afterwards as Shafi explicitly mentioned this and the mids within the Shafer school have agreed upon it"
    summary_en: "Imam an-Nawawi and Imam ash-Shafi'i affirmed that reciting whatever is easy from the Qur'an and making du'a afterwards at the grave is religiously recommended."
  - id: "M06"
    speaker: "Knowledge Channel Host"
    timestamp: "00:06:59"
    quote: "the sticks saying Subhan Allah while they were moist yeah as long as those sticks are moist while they are moist then for the dead to benefit from the recitation of the Quran at the grave is even more so valid"
    summary_en: "Scholars deduced the validity of reciting Qur'an at the grave a fortiori from the Prophet's placing moist palm branches on graves to lighten punishment through their tasbih."
  - id: "M07"
    speaker: "Knowledge Channel Host"
    timestamp: "00:08:41"
    quote: "forgiven so recite it over your dead Ahmed narrated it question what if he says that some of the explained these to be about the one who's dying a wahabi said these hadiths they don't. mean what you say some of the said that this means recite over your dying people"
    summary_en: "The speaker cites the narration instructing recitation of Surah Ya-Sin over the dead, contrasting the apparent wording with the Wahhabi claim that it applies only to the dying."
  - id: "M08"
    speaker: "Knowledge Channel Host"
    timestamp: "00:10:21"
    quote: "it's possible to take the Quran or the Hadith by face value at face value whenever that's possible that's better in fact it's not permissible to explain the Quran and the Hadith by other than what appears without an Evidence"
    summary_en: "The speaker responds to the claim that 'dead' means 'dying' by affirming the hermeneutical rule that texts must be taken at apparent value unless an evidence necessitates departure."
  - id: "M09"
    speaker: "Knowledge Channel Host"
    timestamp: "00:11:08"
    quote: "would be said that if the one on his deathbed benefits from the recitation of Yas although this recitation is not from his own Deeds not one of his own Deeds"
    summary_en: "The speaker argues that even if applied to a dying person, benefit reaches someone from another's deed, and the deceased similarly hears and benefits."
  - id: "M10"
    speaker: "Knowledge Channel Host"
    timestamp: "00:13:13"
    quote: "he made a will that when he is buried the beginning and end of albak should be recited at his grave and I heard Omar making the same will"
    summary_en: "Imam Ahmad ibn Hanbal initially considered reciting at the grave an innovation, but upon hearing the narration regarding Ibn Umar's will, he immediately retracted and permitted it."
  - id: "M11"
    speaker: "Knowledge Channel Host"
    timestamp: "00:14:21"
    quote: "the only time it's obligatory to face. the ca is when you're in your prayer the scholar said facing the Kaa is an obligation only for prayer not for anything else"
    summary_en: "Facing the Ka'bah is an obligation exclusively for prayer; during du'a or recitation, facing any direction is permissible, and forbidding facing the grave stems from unwarranted accusations of shirk."
new_claims:
  - id: "C01"
    speaker: "Knowledge Channel Host"
    claim: "Reciting the Qur'an over the graves of deceased Muslims is religiously recommended and endorsed by scholars across the madhhabs."
    quote: "definitive of its religious legitimacy as Zar said I asked as Sha about reciting at the grave and he said there is no problem with it"
    summary_en: "Scholars of the Shafi'i and other Sunni schools affirmed the religious recommendation and legitimacy of reciting the Qur'an at graves."
  - id: "C02"
    speaker: "Knowledge Channel Host"
    claim: "The deceased benefit from the recitations, supplications, and charities performed on their behalf by the living by scholarly consensus."
    quote: "the dead benefit from the supplication of the living and the dead benefit from the Charities of the living given on behalf of the dead"
    summary_en: "There is scholarly consensus (ijma') that supplications and charitable deeds performed on behalf of deceased Muslims benefit them."
  - id: "C03"
    speaker: "Knowledge Channel Host"
    claim: "Hadith texts ordering recitation over the dead must be accepted at face value, refuting the restrictive Wahhabi claim that they apply only to the dying."
    quote: "because the wording of the Hadith is not the one who's on his deathbed it's m the dead ones and there's no need to make such an inference y to make such a TA to take this non-literal interpretation is not necessary"
    summary_en: "The wording of the prophetic hadith specifies 'the dead' (mawtaakum) directly, and departing from the literal meaning without evidence is invalid."
  - id: "C04"
    speaker: "Knowledge Channel Host"
    claim: "Imam Ahmad ibn Hanbal explicitly retracted his disapproval of reciting at the grave upon learning of the practice of the Companions including Ibn Umar."
    quote: "said catch him and tell him to go back and recite this is how Al narrated it in his book"
    summary_en: "Imam Ahmad revoked his initial opinion and endorsed recitation at the grave after learning that Ibn Umar willed the recitation of Surah al-Baqarah at his grave."
counter_questions:
  - id: "CQ01"
    target: "Opponent"
    question: "If facing the Ka'bah during du'a does not make a person a worshiper of the Ka'bah, why do you claim that facing the grave makes someone a worshiper of the grave?"
    quote: "why would I be worshiping the cabba if I face the Caba so he'll say no tell him then what make you think I'll worship the dead person if I was facing the dead person"
    summary_en: "A counter-question exposing the double standard of assuming direction of prayer or du'a implies divine worship of the object in front of the supplicant."
  - id: "CQ02"
    target: "Opponent"
    question: "Why do you insist on a figurative interpretation (ta'wil) claiming 'your dead' means 'those on their deathbed', when you usually accuse Muslims of heresy for making ta'wil?"
    quote: "you give us a hard time all the time about making we just spent. more than half the book refuting you about now you have aith you want to insist on a"
    summary_en: "A counter-question exposing the hypocrisy of Wahhabis who condemn ta'wil in texts of attributes yet resort to arbitrary ta'wil to deny recitation for the dead."
  - id: "CQ03"
    target: "Opponent"
    question: "If an inanimate moist branch lightens the punishment of the grave through its remembrance, how could the Qur'anic recitation of a righteous believer not benefit the deceased?"
    quote: "for if it is lightened for them by the plants if the torture is lightened for them by the plants then how will . about by the Quran recitation of a believing person that's even greater a believer's recitation of the Quran is greater"
    summary_en: "A logical counter-question drawing an a fortiori comparison between the tasbih of a plant and the Qur'anic recitation of a human believer."
debate_tips:
  - id: "DT01"
    topic: "Facing the grave during supplication"
    quote: "facing the Kaa is an obligation only for prayer not for anything else so when you're at your house in your own house making Dua you're GNA make Dua whatever way you're facing or you might turn and face Thea the you might or you might not you don't have to you can and you don't have to"
    summary_en: "Clarify that facing the qiblah is legally required only for ritual prayer (salah), so making du'a facing any direction—including towards the grave after burial—is entirely permissible."
  - id: "DT02"
    topic: "Hermeneutical rule of apparent meaning (zahir)"
    quote: "it's possible to take the Quran or the Hadith by face value at face value whenever that's possible that's better in fact it's not permissible to explain the Quran and the Hadith by other than what appears without an Evidence"
    summary_en: "Hold opponents to the standard principle that sacred texts must be understood on their literal and apparent phrasing unless explicit religious evidence mandates a non-literal interpretation."
  - id: "DT03"
    topic: "Citing Imam Ahmad's retraction to Hanbali opponents"
    quote: "said catch him and tell him to go back and recite this is how Al narrated it in his book and Allah knows best"
    summary_en: "When debating opponents who claim to follow Imam Ahmad ibn Hanbal or the Salaf, cite Imam Ahmad's documented retraction and Ibn Umar's bequest to recite Surah al-Baqarah at the graveside."
