counter_questions:
  - id: CQ-K16
    summary_en: "Is it an absolute condition that the one who hears must be physically alive and present?"
    used_in: M05

  - id: CQ-K17
    summary_en: "If the fluid in the spines of men could hear Ibrahim's call, what makes it impossible for deceased or distant souls to hear by Allah's will?"
    used_in: M04

  - id: CQ-K18
    summary_en: "If calling the absent were shirk, why did Umar call out to Sariyah across hundreds of miles without condemnation?"
    used_in: M07

debate_tips:
  - timestamp: "00:06:07"
    quote: "So we pose the question, wanting only a yes or no answer: Is it a condition that the one who hears be alive and present?"
    summary_en: "Corner the interlocutor with a direct binary question on whether physical presence and earthly life are mandatory conditions for hearing."

  - timestamp: "00:07:20"
    quote: "If he says: \"Not if the caller is a prophet,\" we object, because statements without evidence are not accepted in our religion. Not if the caller is a prophet, then what happened to the ayah: Oh Muhammad, you do not make the dead hear? How do you explain it then, Wahhabi?"
    summary_en: "Expose ad-hoc exceptions: if an opponent invents an unevidenced prophet-only exception, demand textual proof and demonstrate how it contradicts their own literalism on 27:80."

  - timestamp: "00:17:13"
    quote: "If you heard a Wahhabi calling the Prophet a corpse, tell him: Call Ibn Taymiyyah a corpse, say it right now, let me hear you say it, let's see if he'll say it."
    summary_en: "Confront derogatory descriptions of the Prophet by demanding whether they would dare apply the same disrespect to their own scholars."

  - timestamp: "00:21:08"
    quote: "So who said, oh Wahhabi, who said there's no tasarruf after death? And who said that a dead person cannot help? Who said that the one who died, after his death cannot help anymore?"
    summary_en: "Demand scriptural proof for the categorical claim that death terminates all saintly assistance (tasarruf) or miracles (karamat) granted by Allah."
