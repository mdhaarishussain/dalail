debate_tips:
  - timestamp: "00:03:44"
    quote: "Consequently, to thoroughly refute them in this topic, it is imperative that you know the documentary references, and that you enforce those references on them, meaning do not allow them to ignore them, do not allow them to ignore the proofs, make them respond."
    summary_en: "Master documentary references and firmly enforce them during debate, preventing the opponent from deflecting or ignoring textual evidence."

  - timestamp: "00:04:37"
    quote: "You can use the word worship in English, but be mindful to always keep the word 'ibadah on deck, as they say, because that's really the word you want to go back to, because it's going to be a matter of defining it."
    summary_en: "Anchor debate definitions to the Arabic term 'ibadah rather than English dictionary entries to avoid linguistic confusion."

  - timestamp: "00:10:41"
    quote: "Always be aware of the Wahhabi reaching for something beside the point. The point is the great companion prostrated to the Prophet, sallallahu 'alayhi wa sallam, and the Prophet did not accuse him of shirk."
    summary_en: "Keep focus strictly on the core theological issue when opponents attempt to change the subject to secondary legal prohibitions."

  - timestamp: "00:24:47"
    quote: "Hence, to refute the Wahhabi, you must understand firmly that worship is not merely calling upon someone, whether alive or dead, nor merely seeking help from someone other than Allah, nor fearing someone, nor being hopeful of something from someone, nor merely glorifying someone, nor merely going to the grave of a wali to seek blessings from there, just as it is not merely prostrating, nor merely seeking refuge."
    summary_en: "Dismantle false accusations of shirk by holding opponents to the classical definition of worship, disallowing the equation of common emotions or supplications with 'ibadah."
