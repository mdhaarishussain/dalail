new_claims:
  - id: IS-WH-C01
    summary_en: "Conquering (istila') is unbefitting for Allah because it implies a preceding struggle or lack of control."
    first_seen: M01

  - id: IS-WH-C02
    summary_en: "Whenever the verb istawa comes with the particle 'ala, it emphatically and literally means physically rising over."
    first_seen: M03

  - id: LG-WH-C01
    summary_en: "Lines of poetry from an unknown author or a non-Muslim poet cannot be cited as linguistic evidence for Qur'anic meanings."
    first_seen: M05

  - id: NZ-WH-C01
    summary_en: "The pronouns in the Hadith of Nuzul ('who calls Me so that I answer him') prove that Allah Himself descends rather than an angel."
    first_seen: M10

counter_questions:
  - id: CQ-CR-01
    summary_en: "If conquering implies struggling or not being in control before, why do you not use the same reasoning against 'rose over', which would imply He was not the highest before?"
    used_in: M01

  - id: CQ-CR-02
    summary_en: "Why is Allah described as Rabb al-'Arsh in particular if He is the Lord and Sustainer of all creations?"
    used_in: M02

  - id: CQ-CR-03
    summary_en: "When a translator conveys speech by saying 'I say', does that mean the translator is speaking about himself or conveying another's words?"
    used_in: M10

