source_id: yt-aBtfpl43rtk
video_title: "Defending the Mawlid"
playlist_index: 37
moves:
  - id: M01
    timestamp: "00:00:06"
    speaker: S
    claim_ref: C01
    quote: "The Wahhabis find this good Sunnah to be an abhorrent major sin, and some claim it to be shirk and kufr."
    summary_en: "Summarizes the extremist Wahhabi stance declaring the Mawlid to be a major sin, shirk, or kufr."
  - id: M02
    timestamp: "00:00:42"
    speaker: S
    claim_ref: C02
    quote: "It was innovated at the beginning of the 7th century by a brave, pious scholar and warrior King al-Muzaffar, the King of Irbil—that's in Iraq. He gathered the scholars from all over for the occasion, and he slaughtered thousands of sheep to feed the people. The muhaddiths, the fuqaha', the true Sufis, and all of the people of the east and the west accepted it."
    summary_en: "Documents the historical initiation of the Mawlid under King al-Muzaffar of Irbil and its universal scholarly reception."
  - id: M03
    timestamp: "00:01:20"
    speaker: S
    claim_ref: C03
    quote: "There was no dissension concerning this matter, there was no debate about it, there was no one accusing anyone of being deviant about it. Even Ibn Taymiyyah, he didn't argue about it. The Prophet, sallallahu 'alayhi wa sallam, said: [ARABIC RECITATION: Hadith on consensus] phrase_as_heard: \"la yajma'ullahu ummati 'ala dalalah\" Allah will not let the scholars of Muhammad's nation agree on a misguidance."
    summary_en: "Cites the prophetic hadith on scholarly consensus, proving the Mawlid is supported by undisputed classical ijma'."
  - id: M04
    timestamp: "00:01:48"
    speaker: S
    claim_ref: C04
    quote: "When the Mawlid was first done some 800 years ago, not a scholar objected, nor the scholars of the centuries after that, thereby establishing the consensus of its validity. Among them were Ibn Hajar, his student as-Sakhawi, and as-Suyuti, who dedicated a booklet to the topic."
    summary_en: "Affirms the centuries of consensus endorsing the Mawlid, citing foremost authorities like Ibn Hajar, as-Sakhawi, and as-Suyuti."
  - id: M05
    timestamp: "00:03:31"
    speaker: S
    claim_ref: C05
    quote: "and found the Jews fasting 'Ashura'. He said, \"What is this?\" meaning, \"Why are you fasting?\" They said, \"This is a good day. This is a day in which Allah rescued the Children of Israel from their enemy, so Moses used to fast this day.\""
    summary_en: "Cites the authentic hadith of fasting 'Ashura' as the foundational scriptural text utilized by Hafidh Ibn Hajar."
  - id: M06
    timestamp: "00:04:58"
    speaker: S
    claim_ref: C06
    quote: "So Ibn Hajar said: This hadith promotes thanking Allah for an endowment that He gave, or a calamity that He relieved on a particular day, and then that day returns in the coming year. And thanking Allah takes place by all sorts of worships, like prostrating, fasting, and reciting. And what endowment is greater than the appearance of this Prophet on that day?"
    summary_en: "Articulates Ibn Hajar's legal deduction: recurring annual gratitude to Allah for granting the greatest endowment (the birth of the Prophet)."
  - id: M07
    timestamp: "00:05:48"
    speaker: S
    debate_tip_ref: T01
    quote: "As for what follows that, such as listening or playing instruments, it should be said that whatever is permissible and aids in spreading happiness among the Muslims—like what? Like sometimes you might do some games for the kids, for example—whatever is permissible and aids in spreading happiness among the Muslims, there is nothing wrong with adding that. And whatever is forbidden or disliked is prevented, etc., to the end of his quote."
    summary_en: "Explains Ibn Hajar's standard: permissible cultural elements that bring joy are allowed, while prohibited actions are banned."
  - id: M08
    timestamp: "00:06:27"
    speaker: S
    claim_ref: C07
    quote: "As-Suyuti said in the aforementioned book—we mentioned his book already, Husn al-Maqsid fi 'Amal al-Mawlid. He said: The answer according to me is that the basis of practicing the Mawlid—which is gathering the people, reciting what is easy of the Qur'an, narrating what came about the Prophet's beginnings and occurred as signs of his birth, then a spread would be laid out so that they can eat, then they leave without doing more than that—is among the good innovations whose practitioner is rewarded, because of what it contains of glorifying the Prophet's status."
    summary_en: "Quotes Imam as-Suyuti defining the core elements of the Mawlid as a praiseworthy innovation whose practitioner is rewarded."
  - id: M09
    timestamp: "00:07:22"
    speaker: S
    counter_question_ref: Q01
    quote: "If the Wahhabi says that, our response is: It is true that the companions were the best, but this does not mean that any goodness that would ever cross the minds of men would cross the minds of the companions beforehand."
    summary_en: "Rebuts the objection that the Sahabah did not celebrate it by rejecting the premise that all beneficial practices had to originate with them."
  - id: M10
    timestamp: "00:08:00"
    speaker: S
    claim_ref: C08
    quote: "And there is no rule that whatever the companions were not the first to think of is rejected! If the Wahhabis are truthful, let them extend this idea to other matters. Let them say: If putting the dots in the Qur'an was good, then the companions would have done it first!"
    summary_en: "Cites the dotting of the Qur'anic mushaf to prove that beneficial innovations initiated after the Sahabah are unanimously accepted."
  - id: M11
    timestamp: "00:08:50"
    speaker: S
    debate_tip_ref: T02
    quote: "Because the Mawlid reminds the person of the Prophet, sallallahu 'alayhi wa sallam, and makes him love him. It pushes the heart, it helps the heart. If the companions did not need the Mawlid because of their complete and perfect love for the Prophet, sallallahu 'alayhi wa sallam, then we do need it because of the dryness of our hearts and our lack of the companions' love for him. Allah!"
    summary_en: "Highlights the spiritual utility of the Mawlid: later generations need reminders to awaken and kindle love for the Prophet."
  - id: M12
    timestamp: "00:10:00"
    speaker: S
    claim_ref: C09
    counter_question_ref: Q02
    quote: "That is easy. Celebrating the Mawlid of any prophet is fundamentally acceptable; it's not just because it was Prophet Muhammad. The Christians went astray by worshipping Jesus and saying he is the son of God! Besides, they do not know when he was born, and their practice of Christmas is blended with paganism, like how they put up the tree and put the decorations around the tree, and other invalid things, unlike the Mawlid."
    summary_en: "Dismantles the false analogy between Mawlid and Christmas: Christmas involves deification and pagan rites, whereas Mawlid contains pure monotheistic praise."
  - id: M13
    timestamp: "00:11:36"
    speaker: S
    claim_ref: C10
    quote: "The evidence for doing all sorts of good deeds at all sorts of times, as individuals and in groups, is the 77th verse of Surat al-Hajj, that Allah says: [ARABIC RECITATION: Surah al-Hajj: 77] phrase_as_heard: \"waf'alu al-khayr\" which means: \"Do the good.\""
    summary_en: "Cites Surah al-Hajj: 77 as an open, unrestricted divine injunction authorizing all forms of virtuous deeds."
  - id: M14
    timestamp: "00:12:18"
    speaker: S
    claim_ref: C11
    quote: "Furthermore, this reasoning of theirs discredits their three aspects of tawhid that they claim: they say the tawhid of Godhood, the tawhid of Lordship, and the tawhid of the Names and Attributes, which is truly a wicked innovation in belief! Not a soul from the Salaf stated it!"
    summary_en: "Exposes the hypocrisy of opponents by pointing out that their tripartite division of Tawhid is an invented theological innovation."
  - id: M15
    timestamp: "00:15:01"
    speaker: S
    claim_ref: C12
    quote: "Because when you want to be a Muslim and confirm your belief, isn't it enough to say, \"No one is God except Allah\"? That's the Godhood, that's enough! So do you have to after that say, \"And there's no Lord except Allah,\" also? No, you don't have to do that!"
    summary_en: "Demonstrates the essential unity of Ilah and Rabb: professing 'La ilaha illallah' inherently encompasses Lordship."
  - id: M16
    timestamp: "00:15:50"
    speaker: S
    counter_question_ref: Q03
    quote: "And what is it narrated about the angels when they ask you in your grave? Don't they say, \"Man Rabbuk? Who is your Lord?\" And then the person in his grave answers. Do the angels right after that follow up and say, \"And by the way, who is your Ilah, also?\" Or do they suffice with asking about the Lord? They suffice with asking about the Lord! They don't have to go back and ask about the Ilah, the God, because it's the same!"
    summary_en: "Cites the questioning of the grave: the angels ask only 'Man Rabbuk', proving Rabb and Ilah are inseparable in Islamic creed."
  - id: M17
    timestamp: "00:18:57"
    speaker: S
    debate_tip_ref: T03
    quote: "And furthermore, this reasoning of theirs—saying, \"Well, you cannot take all these separate elements and put them together to come up with a way of practicing the Mawlid\"—this reasoning discredits their three aspects of tawhid! Because refusing to acknowledge that their division of tawhid is an innovation, when asked for an explicit text from the Qur'an or the hadith, an explicit documentation, they say, \"We have only gathered the various verses about these issues and put them together!\" They are masters of hypocrisy!"
    summary_en: "Turns the opponents' own methodology against them: if gathering scattered texts justifies their 3 Tawhids, it a fortiori justifies the Mawlid."
  - id: M18
    timestamp: "00:20:16"
    speaker: S
    claim_ref: C13
    quote: "Actually, Ahl al-Sunnah's practice of the Mawlid is like the innovation of the Muslims who followed 'Isa: [ARABIC RECITATION: Surah al-Hadid: 27] phrase_as_heard: \"wa ja'alna fi qulubilladhinattaba'uhu ra'fatan wa rahmah wa rahbaniyyatan ibtada'uha\""
    summary_en: "Cites Surah al-Hadid: 27 as scriptural proof that innovating non-obligatory worship seeking Allah's pleasure is praiseworthy."
  - id: M19
    timestamp: "00:23:18"
    speaker: S
    debate_tip_ref: T04
    quote: "The answer is: But when that came in the Qur'an and there was nothing to delegitimize it, then we knew that it was also part of our Shari'ah. That's a rule: when a practice of the previous nations comes in our religious texts, and there's nothing in our religious texts that voids that practice, then it's also for us a religious practice, it's also a rule for us! If the Wahhabi says that there is no monasticism in this nation, tell him: That is not our point! The point is that they did a good innovation!"
    summary_en: "Applies the usul principle (shar'u man qablana): praiseworthy practices of earlier nations unrepealed in our scripture serve as valid proofs."
  - id: M20
    timestamp: "00:24:14"
    speaker: S
    debate_tip_ref: T05
    quote: "What is strange is that the Wahhabi government has an entire week dedicated to celebrating the birth of Muhammad ibn 'Abd al-Wahhab! Wallahu a'lam."
    summary_en: "Exposes the glaring double standard of the Wahhabi establishment celebrating 'Ibn 'Abd al-Wahhab Week' while outlawing the Prophet's Mawlid."
