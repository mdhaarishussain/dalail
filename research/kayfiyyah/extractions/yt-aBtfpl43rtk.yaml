counter_questions:
  - id: Q01
    question: "If every religious practice not initiated by the Companions is rejected, why do you accept adding dots and vowel marks to the Qur'an, compiling hadith into chapters, and building minarets, none of which were done by the Sahabah?"
    target_claim: C08
    purpose: "Exposes the inconsistency of the argument from the Sahabah's non-action (at-tark)."
  - id: Q02
    question: "The Prophet warned against praising him as Christians praised Jesus by deifying him as God; how does gathering to recite the Qur'an, feed the poor, and send blessings on a human Messenger equate to claiming he is the Son of God?"
    target_claim: C09
    purpose: "Destroys the conflation between legitimate Islamic veneration and Christian polytheism."
  - id: Q03
    question: "When the two angels question the deceased in the grave, why do they ask only 'Who is your Lord?' without asking 'Who is your Ilah?', if Rububiyyah and Uluhiyyah are allegedly separate pillars of faith?"
    target_claim: C12
    purpose: "Dismantles the sectarian tripartite division of Tawhid using the established eschatological hadith."
debate_tips:
  - id: T01
    tip: "Distinguish between the core practice and incidental abuses: defend the foundation of the Mawlid (recitation, feeding, praise) while making clear that any illicit behavior that might occur is independently condemned."
    category: jurisprudential-defense
  - id: T02
    tip: "Frame the need for the Mawlid psychologically: the Companions lived with the Prophet and had overflowing love; modern Muslims suffer from spiritual dryness and actively need commemorative gatherings to rekindle devotion."
    category: spiritual-rhetoric
  - id: T03
    tip: "Use the mirror rebuttal against systemic innovations: when opponents claim you cannot combine separate scriptural acts into a ceremony, show that their own foundational creed (the 3 Tawhids) relies on the exact same synthesis."
    category: methodological-trap
  - id: T04
    tip: "Cite Qur'anic praise of prior righteous innovations: Surah al-Hadid 57:27 explicitly praises unprescribed worship innovated for Allah's pleasure, establishing the scriptural legitimacy of good innovations."
    category: tafsir-evidence
  - id: T05
    tip: "Expose modern institutional hypocrisy: point out that the very regimes that ban the Prophet's Mawlid officially celebrate multi-day state conferences and commemorations for their own sectarian founder."
    category: political-exposure
