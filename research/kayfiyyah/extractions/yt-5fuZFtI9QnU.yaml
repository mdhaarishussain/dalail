source_id: yt-5fuZFtI9QnU
video_title: "Defending Tawassul (2): Its Linguistic and Religious Meanings"
playlist_index: 31
moves:
  - id: M01
    timestamp: "00:01:58"
    speaker: S
    claim_ref: C01
    quote: "Tawassul linguistically means to seek a means. In the dictionary he says, so he says under the letters waw-sin-lam: wassala ilayhi wasilatan, meaning he gets favor with that one or a higher status with that one. Its plural is wasil and wasa'il."
    summary_en: "Defines wasilah and tawassul linguistically from the Arabic dictionary as seeking a means to gain favor or higher status."
  - id: M02
    timestamp: "00:03:14"
    speaker: S
    claim_ref: C02
    quote: "Therefore, when Allah said in His Book: [ARABIC RECITATION: Surah al-Ma'idah: 35] phrase_as_heard: \"wabtaghu ilayhil-wasilah\" \"Seek the wasilah, the means to Him,\" it means seek whatever grants you a higher status to Allah."
    summary_en: "Cites Surah al-Ma'idah: 35 as an unrestricted divine command to seek means of drawing close to Allah."
  - id: M03
    timestamp: "00:04:10"
    speaker: S
    debate_tip_ref: T01
    quote: "This verse is not restricted, and therefore it is not valid for a Wahhabi to restrict it to particular conditions that he believes in, as will be made clear."
    summary_en: "Explains that Qur'anic commands remain general and cannot be restricted by opponents' invented conditions without proof."
  - id: M04
    timestamp: "00:05:13"
    speaker: S
    claim_ref: C03
    quote: "So technically, tawassul is to seek from Allah a benefit or to seek from Allah repulsion of harm by mentioning the name of a prophet or a waliyy out of honor of the one by whom the tawassul is made."
    summary_en: "Provides the formal technical definition of tawassul in Islamic theology."
  - id: M05
    timestamp: "00:08:34"
    speaker: S
    claim_ref: C04
    quote: "He said: Advancing the wasilah, which is the means—he means here in this context the good deeds and the offerings—advancing the wasilah before seeking the need makes it more likely for one to be answered. That's why we do it."
    summary_en: "Cites Imam an-Nasafi's tafsir of Surat al-Fatihah explaining that advancing a means before asking makes the prayer more likely to be granted."
  - id: M06
    timestamp: "00:09:48"
    speaker: S
    claim_ref: C05
    quote: "An important point to make is that it is not a condition to say \"by the status of.\" One can merely say, \"I ask You by Muhammad,\" as will be seen. He doesn't have to say, \"I ask You by the status of Muhammad.\" This is permissible and has only been made forbidden by the Wahhabiyyah, thus they have deviated from Ahl al-Sunnah."
    summary_en: "Clarifies that explicitly saying 'by the status of' is not a prerequisite; saying 'by Muhammad' is linguistically and religiously valid."
  - id: M07
    timestamp: "00:12:23"
    speaker: S
    debate_tip_ref: T02
    quote: "You do not have to bring the evidence that these conditions are false. Why? Because you didn't make the claim, he did."
    summary_en: "States the foundational debate rule: the party claiming an act is forbidden or restricted bears the burden of proof."
  - id: M08
    timestamp: "00:13:29"
    speaker: S
    claim_ref: C06
    quote: "The Prophet, sallallahu 'alayhi wa sallam, also said: [ARABIC RECITATION: Hadith in Bukhari on invalid conditions] phrase_as_heard: \"kullu shartin laysa fi kitabillahi fahuwa batil\" \"Every condition that is not in the Book of Allah is invalid, even if it were a hundred conditions.\""
    summary_en: "Cites the authentic hadith in Bukhari invalidating any condition that lacks scriptural authorization."
  - id: M09
    timestamp: "00:14:28"
    speaker: S
    debate_tip_ref: T03
    quote: "Just remember, though, an important point in order for this strategy to work in a debate, which is to make your opponent the one who has to prove his point: you have to refrain from making a claim. You must refrain from making a claim."
    summary_en: "Advises debaters to refrain from making assertions so the opponent cannot reverse the burden of proof."
  - id: M10
    timestamp: "00:15:40"
    speaker: S
    claim_ref: C07
    quote: "One: within it is evidence that mere calling is not worship, because the blind man was personally ordered by the Prophet to call upon the Prophet, who would never order someone to worship him."
    summary_en: "Deduces from the Hadith of the Blind Man that merely calling upon a person is not worship."
  - id: M11
    timestamp: "00:16:25"
    speaker: S
    debate_tip_ref: T04
    quote: "Because there's a hadith: [ARABIC RECITATION: Hadith on Du'a] phrase_as_heard: \"ad-du'a'u huwal-'ibadah\" They translate it as \"calling is worship,\" or \"calling is the essence of worship.\" It means supplicating, du'a, making supplication, praying and asking Allah. That's what it means. It doesn't mean you're saying, \"Hey, yo!\""
    summary_en: "Refutes the Wahhabi linguistic equivocation between du'a (supplicating Allah) and nida' (calling someone)."
  - id: M12
    timestamp: "00:21:10"
    speaker: S
    claim_ref: C08
    quote: "He said: \"I swear by Allah, we had not dispersed, nor had the session been long, when the man came back to us seeing, as if he had never been blind.\" This means that he went away from the Prophet, sallallahu 'alayhi wa sallam, as the Prophet ordered him, then said the supplication that contains calling on the Prophet, sallallahu 'alayhi wa sallam, and then he came back seeing. So he called on the Prophet by the Prophet's command in the Prophet's absence."
    summary_en: "Proves that calling upon the Prophet in his absence is permissible, since the blind man supplicated at the wudu station away from the Prophet."
  - id: M13
    timestamp: "00:24:31"
    speaker: S
    claim_ref: C09
    quote: "So 'Uthman ibn Hunayf, he taught the man this du'a. \"Then come to me,\" he told the man after he told him the du'a. He said to him, \"Then come to me so that I would go with you.\" The man left and did as he said. Ya'ni he went to the wudu place, he made wudu, he prayed two rak'ahs, and then he said the du'a."
    summary_en: "Narrates 'Uthman ibn Hunayf teaching the tawassul du'a during the caliphate of 'Uthman ibn 'Affan, proving tawassul after the Prophet's death."
  - id: M14
    timestamp: "00:27:18"
    speaker: S
    claim_ref: C10
    quote: "Ibn Taymiyyah was the first to prohibit making tawassul by the Prophet, sallallahu 'alayhi wa sallam. Taqiyy ad-Din as-Subki wrote a book titled: [ARABIC RECITATION: Title of Imam al-Subki's book] phrase_as_heard: \"shifa'us-siqam fi ziyarati khayril-anam\" It means The Cure of the Sick. He's saying: this book of mine is to cure the sick. Who's the sick one? Ibn Taymiyyah!"
    summary_en: "Identifies Ibn Taymiyyah as the first in history to ban tawassul, and cites Imam al-Subki's refutation Shifa' al-Siqam."
  - id: M15
    timestamp: "00:29:03"
    speaker: S
    claim_ref: C11
    quote: "He said: Know that it is permissible and good to make tawassul, to seek help, and to seek intercession by the Prophet, sallallahu 'alayhi wa sallam, to one's Lord, the Glorified and Exalted. The permissibility and goodness of that is known by every religious person. It is known by the doings of the prophets and messengers, as we have demonstrated, and the biographies of the righteous Salaf, and no one has denied that from any religion, and the denial of it was never heard of at any time in history until Ibn Taymiyyah came and spoke about it with speech by which he fooled those who are weak and inexperienced or gullible, those who are weak and gullible."
    summary_en: "Quotes Imam al-Subki proving the unanimous consensus of all religions, prophets, and the Salaf on the validity of tawassul prior to Ibn Taymiyyah."
  - id: M16
    timestamp: "00:30:39"
    speaker: S
    claim_ref: C12
    quote: "The validity of tawassul by the prophets and the pious, and by what is alive and what is not alive, is in the well-known aforementioned hadith, meaning the hadith we mentioned last week, narrated from the route of Abu Sa'id al-Khudri from the Messenger of Allah, sallallahu 'alayhi wa sallam: [ARABIC RECITATION: Hadith of walking to mosque] phrase_as_heard: \"allahumma inni as'aluka bi-haqqis-sa'ilina 'alayk\" If someone left his house to go to the prayer and he said: \"O Allah, surely I ask You by the right of those who ask You, and by the right of this walking of mine.\""
    summary_en: "Cites the hadith of walking to the mosque as textual evidence for tawassul through non-living deeds as well as righteous believers."
  - id: M17
    timestamp: "00:33:40"
    speaker: S
    counter_question_ref: Q01
    quote: "If making tawassul by someone who is not alive is shirk, then according to the Wahhabis, Adam, according to them along with the four imams, is a mushrik, because he made tawassul although the Prophet was not alive. He made tawassul by the Prophet, sallallahu 'alayhi wa sallam, although he was not alive."
    summary_en: "Drives the reductio ad absurdum: claiming tawassul through the deceased is shirk brands Prophet Adam and the Four Imams as mushriks."
  - id: M18
    timestamp: "00:37:51"
    speaker: S
    claim_ref: C13
    counter_question_ref: Q02
    quote: "He did not say, \"They directed themselves by me to You because Your Prophet has died.\" So where did the Wahhabi get that from? He's basically saying to you: \"Well, 'Umar, he made tawassul by al-'Abbas because the Prophet had died, so why are you making tawassul by the Prophet?\" Well, where did he get that from? Al-'Abbas himself said why 'Umar did that. He said: \"It's because of my status to Your Prophet.\" He didn't say because the Prophet died."
    summary_en: "Refutes the objection from 'Umar's tawassul via al-'Abbas by quoting al-'Abbas's own words stating the reason was honoring the Prophet's lineage."
  - id: M19
    timestamp: "00:38:48"
    speaker: S
    debate_tip_ref: T05
    quote: "Furthermore, leaving out something is not evidence that it is forbidden. So number one: the Prophet's uncle al-'Abbas, he gave the reason himself why 'Umar made tawassul by him instead of the Prophet. And number two: leaving out something is not proof that it's haram. Just because he didn't do it doesn't mean it's haram, doesn't mean that what he left out is haram. There's no such rule."
    summary_en: "Articulates the fundamental usul rule: omitting an act (at-tark) does not constitute proof of its prohibition."
  - id: M20
    timestamp: "00:41:49"
    speaker: S
    claim_ref: C14
    counter_question_ref: Q03
    quote: "When you said Allah exists above the Throne where nothing exists, you're still comparing Allah to the Throne itself, because in order to establish above and below, you have to make a comparison. That's because above and below are relative directions, that means comparable. Relative means comparable. So what's to my right could be to your left, depends on who's what's being compared. What's in front of me could be what's behind you. What's above you could be what's below me, so what's below me is above my neighbor who lives below me. It's all by comparison. So saying Allah exists above the Throne and there's nothing there, you're still likening Him to the Throne itself, so that's blasphemy."
    summary_en: "Logically refutes attributing direction or position above the Throne to Allah by demonstrating that directions are relative and imply bodily comparison."
