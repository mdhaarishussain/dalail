counter_questions:
  - id: Q01
    question: "If making tawassul through someone who is not alive is shirk, did Prophet Adam commit shirk when he supplicated through Muhammad before Muhammad was created, and did the Four Imams commit shirk by mandating greetings to the deceased Prophet in Tashahhud?"
    target_claim: C03
    purpose: "Forces the opponent into the indefensible position of declaring Prophet Adam and the Four Sunni Imams to be polytheists."
  - id: Q02
    question: "Whose explanation of 'Umar's tawassul via al-'Abbas should Muslims accept: al-'Abbas himself who stated it was due to his kinship to the Prophet, or Wahhabis who claim 1,200 years later that it was because the Prophet died?"
    target_claim: C13
    purpose: "Pits the explicit textual testimony of the Sahabi against the modern sectarian assumption."
  - id: Q03
    question: "If you claim Allah exists 'above' the Throne in a literal direction, how can you avoid likening Him to physical creations when 'above' is an inherently relative spatial dimension that exists only by comparison to created boundaries?"
    target_claim: C14
    purpose: "Exposes the anthropomorphic nature of spatial attribution using rational theological critique."
debate_tips:
  - id: T01
    tip: "Maintain the generality of Qur'anic texts: when an ayah contains an unrestricted command (such as 'wabtaghu ilayhil-wasilah'), reject any opponent's attempt to impose restrictive conditions unless they produce explicit scriptural evidence."
    category: scriptural-hermeneutics
  - id: T02
    tip: "Enforce the burden of proof strictly: the party making the prohibition or asserting conditions bears the sole burden of proof (al-bayyinatu 'alal-mudda'i); never accept a demand to 'prove them wrong.'"
    category: procedural-rule
  - id: T03
    tip: "Do not make unsolicited claims in debate: keep your stance confined to questioning and examining the opponent's assertions so they cannot deflect the burden of proof onto you."
    category: strategic-control
  - id: T04
    tip: "Distinguish between du'a (worship/supplication directed to Allah) and nida' (calling someone): expose opponents who deceptively translate 'ad-du'a'u huwal-'ibadah' as 'calling is worship.'"
    category: linguistic-defense
  - id: T05
    tip: "Enforce the principle that omission is not prohibition (at-tarku laysa bi-hujjah): an individual choosing one permissible action over another never constitutes proof that the unchosen action is unlawful."
    category: usul-defense
