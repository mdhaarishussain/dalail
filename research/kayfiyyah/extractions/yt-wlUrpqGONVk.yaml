debate_tips:
  - id: "DT01"
    topic: "Use primary authentic hadiths rather than reports lacking chains",
    quote: "evidence in your debate. you don't want to submit it as evidence in your debate now you might say but wait a minute you just right now submitted it and I would say to you not really only for clarity here because what we're submitting is really the Hadith of the Prophet"
    summary_en: "Anchor your argument in primary sahih hadiths like Imran ibn Husayn's narration in Bukhari rather than secondary athar that opponents can easily dismiss for lacking a continuous chain."
  - id: "DT02"
    topic: "Never initiate a topic without knowing the proof and deeper details",
    quote: "if you want to be able to give a person aof then don't talk about something unless you know the proof don't open the subject about something and here's general advice for you"
    summary_en: "Ensure you have substantive knowledge and supporting evidence ready before introducing any theological claim in debate."
  - id: "DT03"
    topic: "Truth cannot be cornered; focus on relevance",
    quote: "you're on the truth there's no issue about being cornered what's he going to do corner you into the truth there's no issue there what are you what are you trying to avoid trying to avoid having to answer a question"
    summary_en: "Do not fear being 'cornered' when standing on sound orthodoxy; simply speak the truth and dismiss irrelevant tangent questions."
