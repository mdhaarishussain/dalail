new_claims:
  - id: "C01"
    speaker: "Knowledge Channel Host"
    claim: "Asserting that Allah occupies a spatial location implies either that Allah is temporally created or that space is co-eternal with Him."
    quote: "the scholars said if Allah is in the place then. means either Allah has created or the place is eternal"
    summary_en: "Classical Sunni theologians demonstrated that spatial containment inherently violates either divine eternity or the createdness of the world."
  - id: "C02"
    speaker: "Knowledge Channel Host"
    claim: "Allah did not acquire spatial location, direction, or change upon creating the heavens and the Throne."
    quote: "not exist before them so after creating places and directions he didn't get a place or a Direction. not exist before them so after creating places and directions he didn't get a place or a Direction. Direction so really really fan doesn't believe in this statement"
    summary_en: "Creating space and directions does not alter the Creator; He remains as He was in pre-eternity without place or physical confinement."
  - id: "C03"
    speaker: "Knowledge Channel Host"
    claim: "Scholarly consensus (Ijma') is an authoritative legal proof across all generations, not confined exclusively to the era of the Sahabah."
    quote: "the religious law came with the infallibility of the nation not the sahab the nation and that's what the Hadith says my nation not my"
    summary_en: "Textual evidence from hadiths on the collective infallibility of the Ummah establishes that valid Ijma' binds Muslims in every historical era."
  - id: "C04"
    speaker: "Knowledge Channel Host"
    claim: "Admitting to disbelief or denying Islam constitutes blasphemy regardless of semantic phrasing."
    quote: "my point is when the cafer says I'm a cafir that's blasphemy just like when the person said I'm not a Muslim that's blasphemy those people"
    summary_en: "Explicitly professing kufr or denying one's Islamic faith constitutes immediate apostasy, disproving the claim that admitting to being a non-Muslim differs from admitting to being a kafir."
