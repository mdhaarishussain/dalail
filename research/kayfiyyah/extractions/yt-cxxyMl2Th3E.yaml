debate_tips:
  - timestamp: "00:06:14"
    quote: "So when a Wahhabi says: \"But you made tawassul by someone who's not present,\" we say to them: So what? It's not permissible in our religion to make stuff up."
    summary_en: "Directly reject newly invented conditions on worship by demanding scriptural proof rather than accepting baseless restrictions."

  - timestamp: "00:15:44"
    quote: "They play all of these word games. Those Wahhabis play all of these word games because they believe in Ibn Taymiyyah more than they believe in the Prophet, sallallahu 'alayhi wa sallam."
    summary_en: "Highlight the double standard of opponents who excuse their own scholars for actions they declare to be shirk when practiced by common Muslims."

  - timestamp: "00:20:19"
    quote: "The evidence is not in the dream, it's in the doing of the companion while no one objected to him."
    summary_en: "Prevent opponents from derailing Malik ad-Dar's report onto the validity of dreams; anchor the argument firmly to the companion's physical action and unanimous silent consensus."

  - timestamp: "00:21:00"
    quote: "Well, you claim to follow the Salaf, so stop talking, do like them and be silent."
    summary_en: "Use an opponent's desperate claim that 'silence equals objection' against them to shut down their verbal objections."
