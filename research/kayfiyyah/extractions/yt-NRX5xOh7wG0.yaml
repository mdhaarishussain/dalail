debate_tips:
  - timestamp: "00:03:46"
    quote: "So in a debate, and also in a lesson, and when you teach people and when you give dawah, keep your answers and keep your statements as brief as possible."
    summary_en: "Keep debate responses concise to prevent interlocutors from misunderstanding or seizing on secondary tangents."

  - timestamp: "00:15:21"
    quote: "So don't feel bad to say the truth without having the Arabic text, but equip yourself with those Arabic texts, memorize them so that you can have them handy and ready."
    summary_en: "Communicate clearly in the language of discussion while memorizing original Arabic texts to deploy when challenged."

  - timestamp: "00:30:18"
    quote: "The fact that you do not know it does not negate its validity. Don't let them tell you \"I don't know it\", as if he's saying therefore it's not proof, never let that happen."
    summary_en: "Firmly reject an opponent's attempt to dismiss evidence merely because their sectarian authorities kept it hidden from them."

  - timestamp: "00:36:04"
    quote: "This is why you need to keep your answers brief, minimize the amount of information in your answers, and I remind myself. The more information you put in there, the more is going to go over his head."
    summary_en: "Limit cognitive load in debate exchanges; presenting too many distinct evidential points at once prevents interlocutors from assimilating the core proof."

  - timestamp: "00:39:33"
    quote: "So a hadith cannot be evidence for the creed unless it is indisputably sound, and this hadith's soundness is disputable."
    summary_en: "Disqualify solitary, internally conflicted narrations from serving as foundational proofs for Islamic dogma."
