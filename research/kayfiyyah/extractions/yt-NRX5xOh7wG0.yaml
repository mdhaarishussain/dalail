    kind: claim
    reported: false
    answers: null
    move_type: practice-consensus
    quote: "This method is the meaning of what ash-Shafi'i said: I believe in what came from Allah according to whatever meaning Allah willed, and in what came from the Messenger of Allah according to whatever meaning the Messenger of Allah meant. This does not mean that he takes it literally, as some would suggest to you it means."
    summary_en: "Interprets Imam ash-Shafi'i's famous submission to divine intent as resignation of details to Allah, not literalism."
    evidence_cited:
      - as_said: "Saying of Imam ash-Shafi'i on the meaning of revealed texts"
