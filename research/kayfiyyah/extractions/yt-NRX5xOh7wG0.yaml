    reported: false
    answers: null
    move_type: definition
    quote: "The scholars of the Salaf have two ways to explain this ayah of istiwa' and other ayat like it. One: The first method is not to specify any meaning for it. This means not to translate it and not to pick any other word for it. They simply say: Istawa as He said about Himself."
    summary_en: "Presents the first method of the Salaf regarding mutashabihat: affirming the revealed text without assigning a physical or translated meaning (tafwid al-ma'na)."
    evidence_cited: []
    responds_to: null
    confidence: high

  - move_id: M02
    timestamp: "00:05:03-00:05:44"
    speaker: S
    side: ahl-e-sunnat
    kind: response
    reported: false
    answers: null
    move_type: charge
    quote: "They did not say: He rose over His Throne as He said about Himself, nor He sat or settled on the Throne as He said about Himself, no. That is from the translators who call themselves Salafis, that \"He rose over the Throne in a manner that befits His majesty.\""
    summary_en: "Rejects the modern translation 'rose over the Throne' as an innovation falsely ascribed to the Salaf."
    evidence_cited: []
    responds_to: null
    confidence: high

  - move_id: M03
