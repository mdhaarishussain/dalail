    kind: charge
    reported: false
    answers: null
    move_type: charge
    quote: "This deed of the Wahhabiyyah is called in Arabic tahakkum, being arbitrary, picking and choosing. In other words, it is saying something without evidence. Do not let him move to another subject until he answers the question or submits to Ahlus-Sunnah."
