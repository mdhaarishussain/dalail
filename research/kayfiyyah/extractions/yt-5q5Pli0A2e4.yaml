    answers: null
    move_type: charge
    quote: "The first is that we ask the Wahhabi what he says about the verse [ARABIC RECITATION: Surah al-Hadid 57:4] phrase_as_heard: \"wa huwa ma'akum ayna ma kuntum\". It apparently means He is with you wherever you are. He will either take it literally or not."
