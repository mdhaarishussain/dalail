    kind: claim
    reported: false
    answers: null
    move_type: support-chain
    quote: "The second is to immediately refer to the aforementioned hadith of 'Imran ibn Husayn. That's the name of this hadith: [ARABIC RECITATION: Sahih al-Bukhari, Kitab at-Tawhid] phrase_as_heard: \"kana Allahu wa lam yakun shay'un ghayruh\". You should have memorized that one already. Allah existed and there was nothing other than Him."
