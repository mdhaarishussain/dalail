    quote: "It may be said to him: What made it permissible for you to make ta'wil and made it forbidden for us? It may also be said to him: Based on what rule did you make ta'wil for one verse and leave it for the other? That's because there's an obvious inconsistency, isn't there?"
    summary_en: "Asks the opponent to explain the objective rule allowing them to make ta'wil for 57:4 while forbidding it for others."
