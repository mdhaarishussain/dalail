    kind: response
    reported: false
    answers: SF-WH-K01
    move_type: consistency
    quote: "If he takes it literally, he contradicted their creed of confirming the direction of highness for Allah. If he says that it means that Allah knows about everything everywhere, then just as he saw fit to interpret the verse in a way different from the apparent meaning to escape contradiction, we also make ta'wil for every verse and hadith that apparently implies that Allah is in a direction, for that is necessary for escaping contradiction."
    summary_en: "Argues that if the opponent interprets 57:4 non-literally to mean knowledge, they concede the validity of ta'wil to avoid contradiction, whereas their literalism on direction verses contradicts 42:11."
    evidence_cited:
