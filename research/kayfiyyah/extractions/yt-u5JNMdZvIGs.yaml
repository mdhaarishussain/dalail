    kind: response
    reported: false
    answers: TK-WH-K01
    move_type: consistency
    quote: "Then why would this person refuse to judge the one who blasphemes as a blasphemer? If he committed kufr, then he's a kafir. If he stole, then he's a sariq, a thief. If he lied, then he's a kadhdhab, a liar. If he did Islam, then he's a Muslim. If he did kufr, then he's a kafir."
    summary_en: "Argues that classifying actions and people by revealed legal statuses is fundamental to Islam, just as confessing the shahada makes someone Muslim and theft makes someone a thief."
    evidence_cited: []
    responds_to: M02
    confidence: high

  - move_id: M04
    timestamp: "00:07:16-00:08:13"
    speaker: S
    side: ahl-e-sunnat
    kind: principle
    reported: false
    answers: null
    move_type: practice-consensus
    quote: "We do not testify about any of them, that is, any of those who were believed to be Muslims, any of those who were attributed to Islam, we do not testify about any of them, not one of them, that he committed blasphemy or shirk or hypocrisy as long as nothing of that sort appears from them."
    summary_en: "Explains the Sunni creedal principle: Muslims are presumed upon faith until explicit kufr outwardly appears."
    evidence_cited:
      - as_said: "creedal statement: 'la nash-hadu 'ala ahadin minhum bi-kufri'"
        timestamp: "00:07:16"
    responds_to: null
    confidence: high

  - move_id: M05
    timestamp: "00:11:21-00:12:13"
    speaker: S
    side: ahl-e-sunnat
    kind: response
    reported: false
    answers: null
    move_type: restrict-evidence
    quote: "This means that if a person calls someone else a kafir, that he had better be correct, or else he will become a kafir for labeling a Muslim with kufr without evidence."
    summary_en: "Clarifies that the hadith penalizing false takfir applies specifically when accusing a Muslim without valid evidence or basis."
    evidence_cited:
      - as_said: "Sahih Muslim: 'Whoever says to his brother Oh kafir...'"
        timestamp: "00:08:32"
    responds_to: null
    confidence: high

  - move_id: M06
    timestamp: "00:15:11-00:15:42"
    speaker: S
    side: ahl-e-sunnat
    kind: principle
    reported: false
    answers: null
    move_type: definition
    quote: "So when would a person commit kufr for calling another kafir? When he has no reason for that. He didn't misunderstand. For example, easy example: he got in an argument with the person and he was so mad at him, he called him a kafir, and he didn't mean you act like a kafir, he meant you're not a Muslim, but he was mad at him. This is kufr, he made takfir on the Muslim, he went out of Islam."
    summary_en: "Differentiates between mistaken takfir based on misconception/ta'wil (which is sinful but not kufr) and baseless takfir in anger denying a Muslim's Islam (which constitutes kufr)."
    evidence_cited: []
    responds_to: M05
    confidence: high

  - move_id: M07
    timestamp: "00:16:01-00:16:28"
    speaker: S
    side: wahhabi
    kind: claim
    reported: true
    answers: null
    move_type: restrict-evidence
    quote: "He didn't say that you can't know if someone committed kufr, there's no hadith like that, there's no ayah like that. Anyone who claims that you can't know if someone committed kufr, then he's challenged with bringing the evidence. The burden of evidence is on the claimer, that's what the Prophet said, sallallahu 'alayhi wa sallam."
    summary_en: "Reports the argument that kufr cannot be determined by observers unless the individual explicitly testifies against themselves."
    evidence_cited: []
    responds_to: null
    confidence: high

