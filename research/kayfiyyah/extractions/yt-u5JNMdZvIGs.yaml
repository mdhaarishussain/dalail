    kind: counter-question
    reported: false
    answers: TK-WH-K02
    move_type: burden
    quote: "Bring us an ayah or a hadith in which it is stated that you cannot know if a person committed kufr, or bring us an ayah or a hadith in which it is stated that you can only say a person committed kufr if he says about himself that he's a kafir and he chooses to leave Islam willingly."
    summary_en: "Demands textual proof from the Qur'an or hadith establishing that external judgment of kufr is impossible without self-testimony."
    evidence_cited: []
