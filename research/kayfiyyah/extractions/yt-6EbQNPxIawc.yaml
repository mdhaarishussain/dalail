new_claims:
  - id: "C01"
    speaker: "Knowledge Channel Host"
    claim: "Orthodox hermeneutics subordinates ambiguous texts to explicit foundational verses, whereas deviant methodology attempts to subordinate explicit verses to ambiguous ones."
    quote: "the interpretation of depends on it's not the other way those people did it the other way they make the"
    summary_en: "The foundational principle of Sunni tafsir requires interpreting mutashabihat in light of unambiguous muhkamat such as 'laysa kamithlihi shay''.' "
  - id: "C02"
    speaker: "Knowledge Channel Host"
    claim: "Negating physical literalism does not constitute denial of divine attributes."
    quote: "can not deny the attribute and not take it literally there's no contradiction between those so what made you think that if you don't take it literally you'll be denying it"
    summary_en: "Affirming divine attributes without corporeal modality (tanzih) avoids both anthropomorphism (tashbih) and nullification (ta'til)."
  - id: "C03"
    speaker: "Knowledge Channel Host"
    claim: "Sunni scholars affirm scriptural attributes with meanings befitting Allah without physical definition or nullification."
    quote: "Allah knows what they mean right there means I'm not taking it literally I'm not even saying what it means and whatever it means it means something befitting that's not taking it literally but that's not denying it either"
    summary_en: "Affirming scriptural terms while consigning their specific reality to Allah (tafwid) or assigning befitting linguistic metaphors (ta'wil) protects transcendence."
