new_claims:
  - id: BD-WH-C01
    summary_en: "The hadith of 'man sanna fi al-Islami sunnatan hasanatan' refers exclusively to the companions or to reviving an existing prophetic sunnah."
    first_seen: M01

  - id: BD-WH-C02
    summary_en: "Every religious innovation without exception is misguidance according to the absolute wording of 'kullu bid'atin dalalah'."
    first_seen: M04

  - id: BD-WH-C03
    summary_en: "The statement of Umar ibn al-Khattab ('ni'mat al-bid'ah hadhihi') was purely linguistic and meant a revival of the prophetic sunnah, not a good innovation."
    first_seen: M07

  - id: BD-WH-C04
    summary_en: "Innovations were only acceptable if approved by the Prophet during his lifetime, and the companions never introduced new matters after him."
    first_seen: M09

