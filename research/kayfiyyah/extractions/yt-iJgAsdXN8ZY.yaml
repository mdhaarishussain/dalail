debate_tips:
  - timestamp: "00:02:36"
    quote: "Especially if it's a debate, he asks you a question, answer his question with a clear answer, period, stop."
    summary_en: "Provide direct, concise answers without volunteered elaborations that give the opponent opportunities to deflect."

  - timestamp: "00:08:59"
    quote: "When you have a discussion with someone or a debate with someone, always remember a fundamental rule: You cannot debate based on a disagreement. You have to debate based on an agreement."
    summary_en: "Anchor debate arguments in mutually acknowledged authorities and undisputed texts rather than disputed partisan figures."

  - timestamp: "00:10:21"
    quote: "So when you talk to him, you can't let him impose on you people that you don't accept as authorities."
    summary_en: "Firmly reject attempts by an opponent to cite their sectarian figureheads as normative evidence against you."

  - timestamp: "00:22:49"
    quote: "Then produce them! That's important there, brothers and sisters, don't ever be afraid to ask a person for his reference. Either he's going to give it to you or not."
    summary_en: "Immediately challenge confident broad assertions by demanding specific, verifiable citations on the spot."

  - timestamp: "00:29:46"
    quote: "Stick to the words I said, I'll defend those, I'm not going to defend your synopsis of what I said."
    summary_en: "Refuse to be baited into defending an opponent's distorted paraphrase or inferred extrapolation of your position."

  - timestamp: "00:31:33"
    quote: "In the debate, he wants to bombard you from the beginning, he gives you everything, and you keep it simple at first. You just answer all his questions, and then you see all what he has, right?"
    summary_en: "Absorb an opponent's initial aggressive barrage patiently, letting them exhaust their arguments before mounting a targeted counter-offensive."

  - timestamp: "00:39:13"
    quote: "Okay, so firstly, I'm not going to let my opponent get out of my question. First he has to submit first, and then we can move to the next point."
    summary_en: "Do not permit interlocutors to transition to secondary points or deductive detours until they definitively resolve the pending question."

  - timestamp: "00:46:11"
    quote: "You don't want to debate with a person who can't reason. That's the meaning of what the scholars said when they said: When I debate with an ignorant person I lose, and when I debate with a knowledgeable person I win."
    summary_en: "Recognize when an opponent lacks basic rational faculties and terminate fruitless exchanges with obstinate interlocutors."
