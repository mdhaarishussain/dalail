counter_questions:
  - id: "CQ01"
    target: "Opponent"
    question: "How can you claim that your sect is 'al-Jama'ah' when you are an undeniable minority numbering fewer than even the Shi'ah?"
    quote: "tell them how could you be and you are fewer than Shiites they would say Jama doesn't mean majority so they distort the meaning of Jama to say that they are"
    summary_en: "A counter-question dismantling the Wahhabi pretense of representing 'al-Jama'ah' while constituting a tiny sectarian fringe."
  - id: "CQ02"
    target: "Opponent"
    question: "Why do you demand that I prove your accusation false when you initiated the claim that following a madhhab is innovation without providing any evidence?"
    quote: "correct my claim that what you're saying is untrue is correct why should I prove that to you when you are the one who made a claim first and didn't give your evidence"
    summary_en: "A procedural counter-question holding the claimant accountable for providing evidence rather than shifting the burden to the respondent."
  - id: "CQ03"
    target: "Opponent"
    question: "If Abu al-Hasan al-Ash'ari and Abu Mansur al-Maturidi were not the legitimate imams of creed, why did all the greatest Sunni scholars across centuries follow them willingly?"
    quote: "so if anyone's going to know that those two were the the top imams it's going to be the other imams so I'd say to that person why did all the scholars follow them nobody forced"
    summary_en: "A counter-question appealing to the unanimous acceptance of the Ash'ari and Maturidi imams by classical Sunni scholarly luminaries."
debate_tips:
  - id: "DT01"
    topic: "The ping-pong / tennis racket rule: stick to one proof"
    quote: "you don't have to tell him there's so many proofs against you that's why you're so wrong I'll tell you all the 15 proofs against you to show you how wrong you are you give them one strong proof"
    summary_en: "Do not overwhelm an opponent by offering dozens of proofs or switching to a new text; keep returning to your single strongest proof until they address it."
  - id: "DT02"
    topic: "Burden of proof on the claimant"
    quote: "proof okay so that's why when you're debating with someone you be mindful about making a claim"
    summary_en: "Be cautious when making positive claims in debate, because asserting a claim gives your opponent the right to demand evidence."
  - id: "DT03"
    topic: "Testing opponent honesty by holding back elaboration"
    quote: "contradict them first when you says something you say no you're wrong for example or no that's incorrect you could keep going and say because. but if you want hold it and then you'll see how honest he is where is he where's his mind at because if he says how is it wrong that means he wants to understand"
    summary_en: "When refuting an opponent, state the negation clearly first and pause to see whether they ask for reasons or stubbornly double down without inquiry."
