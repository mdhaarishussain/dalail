new_claims:
  - id: "C01"
    speaker: "Knowledge Channel Host"
    claim: "The designation 'Wahhabi' is a documented historical term coined by contemporary scholars and the founder's own brother."
    quote: "indeed there is a such group called wahabis the scholars of their time when they first emerged called them wahabis"
    summary_en: "Scholars contemporary to Muhammad ibn Abd al-Wahhab, including his brother Sulayman, used the term 'Wahhabiyyah' to designate the movement."
  - id: "C02"
    speaker: "Knowledge Channel Host"
    claim: "Applying the name 'Wahhabi' to followers of Muhammad ibn Abd al-Wahhab complies with classical Arabic grammatical rules of nisbah."
    quote: "apply the yet to the last part of the name that's a linguistic rule that's not a disrespect of God"
    summary_en: "Grammatically deriving the term 'Wahhabi' from the compound name Muhammad ibn Abd al-Wahhab respects Arabic linguistic rules without disrespecting the divine name al-Wahhab."
  - id: "C03"
    speaker: "Knowledge Channel Host"
    claim: "Taking a neutral stance or doubting the uncreated transcendence of Allah's attributes constitutes disbelief according to Imam Abu Hanifah."
    quote: "he has disbelieved he committed kufur that's the real salafy"
    summary_en: "Imam Abu Hanifah affirmed in al-Wasiyyah that certainty of transcendence is required in Islamic faith, and neutrality regarding createdness is kufr."
  - id: "C04"
    speaker: "Knowledge Channel Host"
    claim: "Imam Abu Hanifah explicitly negated physical sitting, dwelling, location, and need from Allah in his commentary on Istiwa'."
    quote: "had he been needy of sitting and dwelling then before creating the arish where was Allah exalted is he exalted is Allah from that highly. greatly that's Abu hanif's quote that's the rest of it"
    summary_en: "Abu Hanifah clarified that Allah was without a place before creating the Throne, refuting the anthropomorphist claim that Istiwa' entails spatial sitting."
