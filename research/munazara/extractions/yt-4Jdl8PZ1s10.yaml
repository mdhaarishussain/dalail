    kind: claim
    maps_to: TW-C03
    move_type: practice-consensus
    quote: "Sahaba-e-karam ka ijma' hua Nabi ki wafat ke baad Nabi ke waseele se dua karna nahi hai! Jab Madinah mein qeht pada to Umar ne Abbas ko waseela banaya... Tamam sahaba-e-karam khamosh rahe... Ye ijma'-e-sukooti hai!"
    summary_en: "Argues Umar's drought prayer through Abbas establishes a silent consensus (ijma' sukuti) that tawassul through the deceased Prophet was abandoned"
    evidence_cited:
