    side: ahl-e-sunnat
    kind: demand
    quote: "Zakir Naik ki speech thi jisme unhone kaha tha ki Quran mein 25 aayatein aisi hain jo waseele ko haram kehti hain... wo kaun si 25 aayatein hain to bata dijiye?"
    summary_en: "Challenges the popular polemical claim made by Dr. Zakir Naik that 25 distinct Quranic verses prohibit waseela"
  - move_id: M02
