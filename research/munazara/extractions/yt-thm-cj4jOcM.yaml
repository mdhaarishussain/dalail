    kind: claim
    maps_to: IS-C03
    move_type: charge
    quote: "Ae paighambar tum keh do ki agar tumko Allah museebat mein daal de to Allah ke siwa kaun hai jo museebat ko door kar sake?... To mushkil-kusha kaun hai? Museebat door karne wala kaun hai? Allah ke ilawa koi ma'bood hai kya?"
