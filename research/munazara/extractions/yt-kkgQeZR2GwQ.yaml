    quote: "Asma bint Abi Bakr ka qawl toh Sahih Muslim ke andar maujood hai lekin wo ja raha tha Hajjaj bin Yusuf... Asma bint Abi Bakr ne ye zaroor kaha tha kazzab hum dekh chuke aur zalim tu hai... usmein bhi naam nahi hai... Mera toh ye hai ke main Mukhtar Saqafi ke baare mein positive nazariya rakhta hoon... Agar usne daawa kiya tha ke ye kazzab tha isne prophethood ka daawa kiya tha toh Sahaba-e-Kiram uske peeche namazein kyun padhte the? Abdullah bin Umar uske peeche namazein padhte the"
