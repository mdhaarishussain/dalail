    answers: AQ-EM-C02
    move_type: practice-consensus
    quote: "Imam Bayhaqi Kitab al-I'tiqad safha 147 pe likhte hain: tamaam af'aal khayr hon ya shar hon wo Allah ki takhleeq se saadir hote hain. Aur safha 151 par Sahih Muslim ki hadith 1812 ke tehat likhte hain ke is hadith mein adab sikhaya gaya hai ke Allah ki sana bayan karte hue behtar umoor ki nisbat ki jaye, shar ki nisbat na ki jaye. Imam Nawawi Sharh Sahih Muslim mein Imam Khattabi ka qawl naqal karte hain ke adaban ye na kaha jaye: 'Ya Khaliqa al-khanazeer' ya 'Ya Rabba ash-sharr', balkay achay umoor ki nisbat ki jaye."
    summary_en: "Cites al-Bayhaqi in Kitab al-I'tiqad and al-Nawawi in Sharh Sahih Muslim citing al-Khattabi, explaining that although Allah creates all things, adab forbids addressing Him as 'Creator of swine' or 'Lord of evil'."
