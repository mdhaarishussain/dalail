    move_type: turnabout
    quote: "Agar sifat ki bunyad par shirk thehrana hai toh sabse bada mujrim Mirza Jhelumi khud hai, kyunke usne kaha: Allah kehta hai 60 saal ki zindagi mujhe de do main tumhe jannat mein mini-god bana doonga!... Aur phir safai dete hue Mirza kehta hai ke nahi jab khaliq aur makhlooq ka farq aa jaye toh shirk nahi rehta! Jab apni baari aati hai toh ye kehta hai, hamari baari mein kehta hai shirk ho gaya. Hum kehte hain Quran-o-Sunnat ki roshni mein jab zaati aur ata'i ka farq aa jaye, haqeeqi aur majazi ka farq aa jaye toh shirk nahi rehta."
    summary_en: "Applies turnabout to Mirza's concept of believers becoming 'mini-gods' in Paradise, arguing that if maintaining the Creator/creation distinction excuses using the word god for creation, then distinguishing between inherent (zaati) and granted (ata'i) attributes completely excludes shirk."
