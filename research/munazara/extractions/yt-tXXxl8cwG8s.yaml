    quote: "Quran mein Allah Samee'-o-Baseer hai, lekin Surah Al-Insan mein bande ko bhi samee'-o-baseer banaya. Allah Ra'oof-o-Raheem hai, Surah At-Tawbah mein Nabi alayhis salam ko bhi ra'oof-o-raheem farmaya. Farq kya hai? Zaati aur ata'i ka farq hai."
    summary_en: "Demonstrates that the Quran shares attributes between Allah and creation (Samee', Baseer, Ra'oof, Raheem), with the distinction residing between inherent infinite divine attributes versus granted finite created attributes."
