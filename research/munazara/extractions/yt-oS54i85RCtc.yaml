    answers: IS-EM-C05
    move_type: practice-consensus
    quote: "Sunan An-Nasa'i mein sahih hadith hai: qabeela Hawazin ke log Nabi Paak alayhis salatu was-salam ki bargah-e-aqdas mein aaye toh Huzoor ne unko farmaya ke jab main Zohr ki namaz padh chuka hoon... Toh tumne Zohr ki namaz ke baad khade ho jana aur khade ho ke kehna ke hum Allah ke Rasool se madad maangte hain, 'inna nasta'eenu bi-rasoolillah'. Quran Paak mein kya hai: 'Iyyaaka Nasta'een' ya Allah hum tujh hi se madad chahte hain, aur yahan Huzoor farma rahe hain ke tumne kehna hai 'inna nasta'eenu bi-rasoolillah' hum Rasoolullah se madad chahte hain. Ye dono takra rahe hain? Nahi takra rahe. Kyunke Allah se madad jab maangein ge toh Allah ko haqeeqi madadgaar samajh ke, Nabi Paak alayhis salatu was-salam se jo madad wo le rahe hain wo Huzoor alayhis salatu was-salam ko haqeeqi madadgaar nahi balkay Allah ki madad ka zariya samajh rahe hain."
    summary_en: "Cites Sunan an-Nasa'i reporting the Prophet instructing Hawazin to publicly declare 'we seek help through the Messenger of Allah', proving that asking the Prophet as a means does not contradict Surah Al-Fatiha."
