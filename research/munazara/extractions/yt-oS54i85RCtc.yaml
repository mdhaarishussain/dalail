  - move_id: M02
    timestamp: "00:00:14-00:01:18"
    speaker: Razavi
    side: ahl-e-sunnat
    kind: response
    reported: false
    answers: IS-EM-C01
    move_type: consistency
    quote: "Tu jab bhi sawal kare Allah se sawal kar, wa idha ista'anta fasta'in billah, tu jab bhi madad ke liye pukare toh Allah Rabbul Izzat ko madad ke liye pukar, Allah se istianat kar. Ab ye hadith maujood hai lekin isi Sunan Abi Dawud ke andar ek doosri hadith bhi hai ke Nabi Paak sallallahu alayhi wa sallam ki bargah-e-aqdas mein Hazrat Sayyiduna Rabi'ah al-Aslami radiyallahu ta'ala anhu aaye toh Aap alayhis salatu was-salam ne farmaya... 'Salnee' tu mujhse maang. Ab ye dono aapas mein takra rahi hain ahadith? Bazahir takra rahi hain lekin haqeeqat mein takrao nahi hai. Kyunke ye jo hukm diya ja raha hai ke tu jab bhi maange Allah se maang wo madad haqeeqi hai, haqeeqi madadgaar Allah hai, Allah ko haqeeqat mein madadgaar samajh ke Allah se mangna hai. Aur jab Huzoor ne apne se maangne ka Rabi'ah ko kaha hai toh Nabi Paak alayhis salam ki madad haqeeqi madad nahi hai, asal mein madad Allah ki hai aur Allah Rabbul Izzat ki ata se Nabi Paak alayhis salam apne Sahabi ko ata farma rahe hain"
    summary_en: "Reconciles the hadith 'when you ask, ask Allah' with the hadith where the Prophet told Rabiah 'ask me', explaining the former refers to real ontological aid from Allah while the latter refers to granted intermediary aid."
    evidence_cited:
      - as_said: "Sunan Abi Dawud (idha sa'alta fas'alillah)"
        timestamp: "00:00:14"
      - as_said: "Sunan Abi Dawud (salnee ya Rabiah)"
