new_claims:
  - id: IS-EM-C01
    legacy_id: EM-C01
    side: ali-mirza
    summary_en: "Du'a is worship exclusive to Allah; therefore, any direct vocative call to other than Allah ('Ya Rasool Allah madad', 'Ya Ali madad') is an act of worship directed to creation, which is shirk."
    move_type: principle
    first_seen: M01

  - id: IS-EM-C04
    legacy_id: EM-C04
    side: ali-mirza
    summary_en: "Even if Allah had granted authority (ikhtiyar) to prophets or saints, calling on them for help remains impermissible shirk, because righteous figures never directed invocations to other than Allah."
    move_type: principle
    first_seen: M04

  - id: IS-EM-C05
    legacy_id: EM-C05
    side: ali-mirza
    summary_en: "Calling upon someone in the unseen (ghaib) or beyond normal physical causality (ma fawq al-asbab) is worship and shirk, whereas asking someone present within normal causality (ma taht al-asbab) is permissible."
    move_type: definition
    first_seen: M02

