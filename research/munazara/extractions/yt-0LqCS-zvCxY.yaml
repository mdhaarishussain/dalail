    side: ali-mirza
    kind: claim
    reported: false
    similar_to: IS-C03
    move_type: definition
    quote: "Ma taht al-asbab mein toh aap jo marzi karein, kisi ko paani pila dein, kisi ka bojh uthwa dein, wo toh theek hai... Lekin jo ghaib mein madad ke liye pukaarna hai, dua kar rahe hain, wo Allah Ta'ala ke sath khaas hai."
    summary_en: "Differentiates between seeking assistance within physical means versus calling upon an entity in the unseen, classifying the latter as exclusive to Allah."
    evidence_cited:
