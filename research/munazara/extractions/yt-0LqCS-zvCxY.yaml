    kind: claim
    reported: false
    similar_to: IS-C03
    move_type: charge
    quote: "Aap Baghdad mein dafan hain aur main yahan se baith kar kahoon 'mujhe paani pila dein', toh shirk hai!"
    summary_en: "Asserts that asking someone deceased or buried far away across distance for water or aid constitutes shirk."
