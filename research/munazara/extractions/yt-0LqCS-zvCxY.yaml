    kind: claim
    reported: false
    similar_to: TW-C06
    move_type: principle
    quote: "Ye ladai nahi hai ke Maula Ali alayhis salam ko ikhtiyar hai ya nahi. Maula Ali ko agar Allah ne ikhtiyar diya bhi ho tab bhi Maula Ali ko aap pukaar nahi sakte madad ke liye, kyunke Maula Ali bhi Allah ko pukaarte the!"
    summary_en: "Argues that even if authority were granted to Ali, invoking him remains impermissible because he himself supplicated only to Allah."
    evidence_cited:
      - as_said: "Surah Al-Fatiha (Iyyaaka Na'budu wa Iyyaaka Nasta'een)"
        timestamp: "00:02:30"
    responds_to: null
