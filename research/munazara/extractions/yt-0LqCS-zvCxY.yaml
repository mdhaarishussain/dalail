    side: ali-mirza
    kind: claim
    reported: false
    similar_to: TW-C07
    move_type: consistency
    quote: "Sabr aur namaz ke zariye madad chaho. Maine kaha iska matlab kya hai? Sabr aur namaz ke zariye Allah se madad chaho, ya koi kehta hai 'Al-Madad Ya Namaz'?"
    summary_en: "Argues that Quran 2:45 means seeking Allah's help through patience and prayer, not calling upon patience or prayer for help."
