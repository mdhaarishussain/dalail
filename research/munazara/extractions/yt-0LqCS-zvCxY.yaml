    reported: false
    similar_to: TW-C08
    move_type: charge
    quote: "Surah An-Naml ki ayat padhein: jo Allah ke ilawa kisi aur ko dua ke liye pukaarna samajhta hai na, wo usey khuda banaye hue hai, ma'bud banaye hue hai! Kyunke aage farmaya: 'a-ilahun ma'allah' — kya Allah ke sath koi aur ilah hai? Maine kaha ye wazeh saboot hai ke ye shirk hai."
    summary_en: "Cites Quran 27:62 to argue that calling upon other than Allah in du'a treats the entity as an Ilah alongside Allah."
