    kind: claim
    reported: false
    similar_to: IS-C01
    move_type: consistency
    quote: "Maine kaha waseela ka matlab hota hai 'Aye Allah hamari madad kar Ali ke waseele se', aap toh direct alfaaz istemal karte hain: 'Ya Ali Madad' ya 'Al-Madad Ya Ghous'."
    summary_en: "Argues that saying 'Ya Ali Madad' or 'Al-Madad Ya Ghous' is direct invocation rather than supplicating Allah through a means."
