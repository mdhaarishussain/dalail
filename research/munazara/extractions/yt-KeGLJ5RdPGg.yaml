    quote: "waseela jo hai na... jo saabit shuda waseela hai wo nabi ki dua ka waseela liya karta tha sahaba... jab nabi faut ho gaye to uske chacha se waseela liya jata tha... waseela bil-amwaat ye najayez hai... bid'at hai"
