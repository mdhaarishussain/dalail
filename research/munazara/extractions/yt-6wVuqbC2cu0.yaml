    quote: "Karamat khilaf-e-shara nahi hoti, khilaf-e-aql zaroor hoti hai jis ko aap khariq-e-aadat kehte hain. Aaj kal unhone naya drama shuru kar diya hai khariq-e-aadat wala, wo kehte hain jee Engineer sahab ghalat keh rahe hain khilaf-e-aql na kahein khariq-e-aadat kahein. Khariq-e-aadat bhi yahi hai: physical phenomena of nature ko todne wali cheez, jo cheez aadat mein nahi hai uske khilaf jana. Basically Ghazali ne inko ye patti padha di hai, wo ye kehta hai ke aadat ye nahi hai ke insaan hawa mein uday lekin udd bhi sakta hai, kabhi kabhar ho sakta hai isliye ye khariq-e-aadat ko le kar chalte hain."
