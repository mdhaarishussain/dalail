    quote: "Mantiq aur usool ke sath talluq rakhne wala is baat ko samajhta hai ke muhaal aur mustaheel ki teen qismein hain: muhaal-e-aadi, muhaal-e-aqli aur muhaal-e-shar'i. Ulama ne karamat aur mojaza ki tareef mein likha hai: 'amrun khariqun' — ye aadat ke khilaf hota hai, aql ke khilaf nahi hota... Ab jo karamat aur mojaza hai, kyunke Allah Rabbul Alameen ki qudrat se nabi se mojaza saadir hota hai aur Allah ki qudrat se wali se karamat saadir hoti hai. Toh kyunke Allah ki qudrat se ho raha hai, ab Allah ki qudrat par aql kya daleel qaim karegi ke ye muhaal hai? Lihaaza jo karamat hai wo khilaf-e-aql nahi hoti, khilaf-e-aadat hoti hai."
