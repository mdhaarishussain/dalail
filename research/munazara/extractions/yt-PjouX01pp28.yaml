    quote: "Maslan woh Bukhari se woh jo ghali Rafzi baar baar pesh kar raha hai ke Hazrat Umar ne jab Islam qabool kiya to woh chup gaye the kyunke unke qatl ke fatwe jari ho gaye the unke qabeelay ke log bahar aake baith gaye... to Hazrat Umar apne ghar se darr ke maare nahin nikal rahe the to ab Sunniyon ko ye baat kaise hazam ho unhein to ek jhooti kahani karayi gayi hai ke jab Islam qabool kiya to woh talwar leke bahar aa gaye... inko pata hai ke jab ye uske khilaf jawab record karwayenge to inko maanna parega ke kuch baatein uski sahih hain"
    summary_en: "Adopts the Shia polemical premise (promoted by Hassan Allahyari) citing Sahih Bukhari 3864 ('kha'ifan') that Umar hid inside his house out of fear upon converting, asserting that traditional Sunni accounts of brandishing a sword or publicly declaring Islam and Hijrah are fabricated myths."
