    quote: "Rasoolullah sallallahu alayhi wa aalihi wa sallam ne bil-khusoos Hazrat Umar ibn al-Khattab radiyallahu ta'ala anhu ka naam leke Allah Rabbul Izzat ki bargah mein dua ki hai Allahumma a'izzal-Islama bi-Umara bnil-Khattab... Sahih Bukhari ke andar 3684 number hadees hai Hazrat Abdullah ibn Mas'ud radiyallahu ta'ala anhu farmate hain ma zilna a'izzatan mundhu aslama Umar farmate hain jab se Umar ne Islam qabool kiya tab se hum izzat wale hain quwwat Allah ne hamein ata ki hai"
    summary_en: "Cites the Prophet's supplication for Umar (Mustadrak al-Hakim, Ibn Majah, Ibn Hibban) and Ibn Mas'ud's testimony in Sahih Bukhari 3684 that Muslims continually possessed strength and honor from the moment Umar embraced Islam."
