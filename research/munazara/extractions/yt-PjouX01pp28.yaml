    quote: "Rasoolullah sallallahu alayhi wa aalihi wa sallam ki zaat-e-aqdas ne bhi Mut'im bin Adi ki panah li jab Huzoor alayhis salatu was salam Ta'if se Makkah al-Mukarramah wapas tashreef laye Sahih Bukhari ke andar ek riwayat maujood hai hadees ka number hai 3139 Badr ke mauqe par Rasoolullah sallallahu alayhi wa sallam ne Mut'im bin Adi ka tazkirah kiya... Mullah Baqir Majlisi ki Bihar al-Anwar uski jild number 19 aur uske safha number 7 aur 8 pe ye waqia maujood hai aur ye Shia ka bohot bara aalim hai Allama Tabarsi uski A'lam al-Wara uske andar safha number 72 pe ye poora tafseeli waqia maujood hai ke Nabi-e-Pak sallallahu alayhi wa aalihi wa sallam jab Ta'if se wapas lautay... apne ghulam Zayd ke sath Huzoor maqaam-e-Hira ki ghaatiyon mein Rasoolullah alayhis salatu was salam chupe hue the... Mut'im bin Adi ne Nabi-e-Pak alayhis salatu was salam ko panah di"
