    quote: "Sahaba-e-Kiram radiyallahu anhum ne un masail mein ikhtilaf kiya jo mahall-e-ijtihad the, jahan har shakhs ne apne taur par daleel pesh ki. In jhagdon ki wajah se un mein se kisi ek ke upar bhi fisq ka itlaq nahi hota... Jang-e-Jamal aur Jang-e-Siffeen mein Hazrat Ali ke muqable mein aane walon se ijtihadi khata hui hai. Inaad aur dushmani ki bunyad par wo nahi nikle, ijtihad tha unka aur har ek apne ijtihad par ma'zoor tha. Mirza Jhelumi 10 saal pehle maanta tha, ab usne naya paintra badla aur U-turn liya aur kaha ke nahi wo mulkiyyat aur dunya ke liye lad rahe the."
