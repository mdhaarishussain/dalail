    speaker: B
    side: ahl-e-sunnat
    kind: response
    quote: "wo ibadat karte the, wahan par ibadat ka lafz hai Quran Majeed mein... hum jab kisi ko waseela qarar dete hain to usme hargiz ye ibadat ka pehlu nahi hota balki dar-haqeeqat Allah Tabaraka wa Ta'ala ki zaat tak pahunchne ka ek zariya hai"
    summary_en: "Waseela does not constitute worship (ibadat); Quranic condemnation of idols refers to worship, whereas waseela is seeking a created means to reach Allah as seen in angels and prophets"
    evidence_cited:
      - as_said: "Surah Zumar ayat 'maa na'buduhum illa li yuqarriboona ila Allahi zulfa'"
