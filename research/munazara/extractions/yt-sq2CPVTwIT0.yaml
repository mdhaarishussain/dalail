    quote: "hum waseela shar'iyyah ki wo teeno qismein maante hain jo Quran aur Sunnah se saabit hain... Allah ke naamon ka waasta... apne nek a'maal ka waseela... aur kisi zinda se dua karwana... Bukhari Shareef ki ke Rasoolullah ke zamane mein hum Rasoolullah ka waseela diya karte the... Hazrat Umar ka daur aaya to unke chacha ki dua ka waseela dete hain"
    summary_en: "Legitimate waseela is strictly limited to three types: divine names, righteous deeds, and the supplication of a living righteous person, citing Umar turning to Abbas for rain"
