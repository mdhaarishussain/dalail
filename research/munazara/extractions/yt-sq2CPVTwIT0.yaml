    kind: claim
    maps_to: IS-C01
    move_type: definition
    quote: "Bhar do jholi meri Ya Muhammad, yahan waseele ki kaun si qisam hai? Ya Rasool Allah madad, Ya Ali madad mein waseele ki kaun si qisam hai?... Isko kehte hain zaat ka waseela, shakhs ka waseela... Hum is waseele ke qa'il nahi hain"
    summary_en: "Phrases like 'Ya Rasool Allah madad' and 'Ya Ali madad' are not waseela but direct requests to creation, and tawassul bi al-dhat is rejected"
