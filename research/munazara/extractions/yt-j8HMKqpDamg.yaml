    quote: "Doosre muqam par farmaya: namaz aur sabr se madad talab karo. Batayein namaz khuda hai? Sabr khuda hai? Nahi, ghairullah hai na. Jaise aap ek dawai khate hain toh aap kehte hain yaar goli badi zabardast thi aisa dard theek kiya hai. Ab batayein sar ka dard durust karne wali zaat kaun hai? Lekin aap keh rahe hain goli ne door kar diya, batayein aap mushrik ho gaye ke nahi ho gaye? Auliya-e-kiram jo hain duniya se tashreef le jane ke baad, ambiya-e-kiram auliya-e-kiram toh ye zinda hote hain"
