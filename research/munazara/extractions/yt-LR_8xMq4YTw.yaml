    kind: claim
    maps_to: TW-C08
    move_type: charge
    quote: "Janab Rasoolullah Sallallahu Alayhi Wasallam ka waseela lena ye bid'at-e-zalalah hai!... kyunki ispe koi bhi ek sahih daleel nahi hai ki kisi sahabi ne Allah ke Rasool ka waseela unki wafat ke baad liya!"
    summary_en: "Taking the waseela of the Prophet after his death is an innovation (bid'ah dalalah) devoid of authentic precedent from the Sahaba"
    confidence: high
  - move_id: M02
    timestamp: "00:02:56-00:03:35"
    speaker: A
    side: wahhabi
    kind: claim
    maps_to: IS-C01
    move_type: definition
    quote: "Isti'anat bi-ghairillah aur tawassul dono mein tafreeq hai!... aap do mauzu ko mix kar rahe hain! Hum isti'anat par baat nahi kar rahe, yaani istighasa par hum baat nahi kar rahe, hum tawassul par baat kar rahe hain"
    summary_en: "Enforces a strict definition separating waseela (means to Allah) from isti'ana/istighatha (seeking aid from creation), arguing they cannot be treated as synonymous"
    confidence: high
  - move_id: M03
    timestamp: "00:04:12-00:05:05"
    speaker: A
    side: wahhabi
    kind: demand
    quote: "Aap kya mayyit se madad ke qa'il hain ya Allah se madad ke qa'il hain mayyit ke zariye? Isko wazeh karein! Aap baar baar keh rahe hain mayyit se madad"
    summary_en: "Demands the claimant state clearly whether he advocates seeking help directly from the dead or asking Allah through the deceased"
    responds_to: M02
  - move_id: M04
    timestamp: "00:05:08-00:05:30"
    speaker: B
    side: ahl-e-sunnat
    kind: counter-question
    maps_to: CQ-01
    quote: "Jo haqeeqi madad hai wo Allah Ta'ala ki hai, majazi madad buzurgaan-e-deen jinse hum waseela lete hain wo hai! Aur waseele ka maine maana bataya wo qurbat yaani qareeb hona Allah Ta'ala ke, ye zariya bante hain"
    summary_en: "Applies the distinction between haqiqi (real/primary) aid belonging exclusively to Allah and majazi (figurative/instrumental) aid attributed to the righteous as a means"
    responds_to: M03
