    quote: "Aaj ki date mein karamat naam ki koi cheez nahi hai, ye categorically mujhse sun lein aap. Karamat zyada se zyada ye hai ke aap koi dua karein Allah Ta'ala aap ki dua sun le. Kar ke kuch nahi dikha sakta! Kar ke agar koi dikha sakta hai toh sirf paighambar dikha sakta hai. Nabi ke duniya se jane ke baad karamat wala ma'amla hai aur wo zyada se zyada ye hai ke aap dua karein aur dua qabool ho jaye, kar ke koi kuch nahi dikha sakta."
