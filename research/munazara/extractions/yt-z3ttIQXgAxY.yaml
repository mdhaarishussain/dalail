    quote: "Ye aqeeday ki kitab hai Imam Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi al-mutawaffa 458 Hijri ki kitab... safha number 373 par likhte hain... Ke ye jitni karamat ka maine zikr kiya hai ye dalalat karti hain karamat ke jaiz hone par, ye daleel hain. Aur Nabi Paak sallallahu alayhi wa sallam ke Sahaba par bhi karamat hui Huzoor ke mubarak zamane mein aur Nabi Paak sallallahu alayhi wa sallam ke parda farmane ke baad bhi, aur Aap alayhis salam ki ummat ke saliheen par bhi... safha number 380 pe Imam Bayhaqi rahmatullahi ta'ala alayh likhte hain... Imam farmate hain ke humne wo karamat riwayat ki hain jo ummat ke beshumar auliya Allah se Nabi Paak sallallahu alayhi wa sallam ki hayat-e-tayyibah mein zahir hui hain aur un karamat ka bhi zikr kiya hai fazail-e-sahaba mein jo Nabi Paak sallallahu alayhi wa sallam ke wisal-e-aqdas ke baad ummat ke auliya Allah se sabit hui hain."
