    quote: "Quran aur Sunnat ke dalail ko samajhne ke liye zati ata'i haqiqi majazi mustaqil ghair-mustaqil in cheezon ka farq karna zaroori hai aur in cheezon ka farq kiye baghair jo Quran aur Sunnat ke dalail ke andar bazahir aapas mein ta'aruz nazar aata hai us ta'aruz ko door nahin kiya ja sakta"
