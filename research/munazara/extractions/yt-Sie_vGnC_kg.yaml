    quote: "Quran mein bhi maujood hai ke jab makhluq ke liye koi lafz bola jaata hai woh un tamam sharait ke sath hota hai zati aur ata'i ke farq ke sath mahdood aur ghair-mahdood ke farq ke sath ye saari cheezein usmein imply hoti hain aur khaliq aur makhluq ke farq ke sath"
