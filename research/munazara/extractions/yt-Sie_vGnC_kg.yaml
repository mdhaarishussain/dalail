    quote: "Ek Khuda jo saari qudraton ka malik hai aur woh akela aur yakta hai beshak woh aapko ye offer deta hai ke sirf ye 60 saal ki zindagi mujhe de do tumhein bhi main ek mini Khuda bana doonga kis hawale se woh rahega makhluq hi lekin jo quality god ke paas hai sir woh aapko ek mini Khuda banane wala hai"
