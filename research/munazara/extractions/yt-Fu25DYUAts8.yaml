    quote: "Toh Sayyiduna Umar Farooq radiyallahu ta'ala anhu ne qabr-e-Rasool par ja kar Huzoor ko request nahi kiya. Unhone kaha ke hum Aap sallallahu alayhi wa sallam ko pehle le ke aate the wo dua karte the, yani tawassul kya? Dua. Ab Aap sallallahu alayhi wa sallam ke chacha Sayyiduna Abbas bin Abdul Muttalib radiyallahu ta'ala anhu ki dua, lekin wo dunyawi zindagi mein maujood the."
    summary_en: "Argues from Bukhari 1010 that Umar requested supplication from Abbas because he was alive, rather than going to the Prophet's grave."
