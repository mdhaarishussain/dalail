    move_type: definition
    quote: "Al-istimdad yani kisi bhi hasti ko museebat aur pareshani mein apni dua ki qabooliat ke liye pukarna jo Islam mein sirf Allah Ta'ala ke sath khaas hai. Aur uska zikr Quran-e-Pak mein jo hum har namaz mein tilawat karte hain: 'Iyyaaka Na'budu wa Iyyaaka Nasta'een'. Allah hum sirf teri ibadat karte hain aur ghaib mein madad ke liye, dua ke liye sirf tujhi ko pukarte hain."
    summary_en: "Defines istimdad as invoking an entity in times of distress for prayer acceptance, arguing this is exclusive to Allah in the unseen based on Surah Al-Fatiha."
    evidence_cited:
      - as_said: "Surah Al-Fatiha (Iyyaaka Na'budu wa Iyyaaka Nasta'een)"
        timestamp: "00:01:47"
    responds_to: null
    confidence: high

  - move_id: M02
    timestamp: "00:02:43-00:03:22"
    speaker: Mirza
    side: ali-mirza
    kind: claim
    reported: false
    maps_to: IS-EM-C01
    move_type: definition
    quote: "Misal ke taur par agar koi shakhs dua mein Sayyiduna Ali ko pukarta hai aur kehta hai 'Ya Ali madad' ma'adhAllah, ke aye Ali radiyallahu ta'ala anhu meri madad farmaiye, toh ye hogi istimdad, ghaibana madad ke liye pukarna. Lekin agar koi shakhs yun kehta hai ke 'Allah, tujhe Sayyiduna Ali ka wasita, mera ye mas'ala hal farma de', yani dua wo Allah se karta hai aur wasita aur qurb ka zariya Sayyiduna Ali ko banata hai, toh isko kahein ge al-tawassul aur waseela. In dono mein zameen aasman ka farq hai."
    summary_en: "Distinguishes between istimdad (invoking an entity directly across the unseen) and waseela (asking Allah using a status as means)."
    evidence_cited: []
    responds_to: null
    confidence: high

  - move_id: M03
    timestamp: "00:03:33-00:04:10"
    speaker: Mirza
    side: ali-mirza
    kind: claim
    reported: false
    maps_to: IS-EM-C04
    move_type: principle
    quote: "Bhaiyon is baat ka jhagda nahi hai ke Sayyiduna Ali ko Allah Ta'ala ne ikhtiyar diya hua hai ya nahi diya hua, ya wo Allah ke ikhtiyar se madad farma sakte hain ya nahi farma sakte. Ye jhagda hi nahi hai. Jhagda ye hai ke kisi ke paas ikhtiyar ho Allah ka diya hua tab bhi usko ghaib mein madad ke liye pukarna khalisatan shirk hai! Barish kaun barsata hai? Allah. Duty kiski hai? Farishton ki. Lekin barish agar farishton se maangein ge jinhein Allah ne izn bhi diya hua hai toh ye khalisatan shirk ho jaye ga."
    summary_en: "Argues that even if delegated power were assumed, asking created beings (such as angels in charge of rain) in the unseen is shirk."
    evidence_cited: []
    responds_to: null
    confidence: high

  - move_id: M04
    timestamp: "00:48:26-00:49:15"
    speaker: Mirza
    side: ali-mirza
    kind: claim
    reported: false
    move_type: attack-chain
    quote: "Toh wo hadith jo hai us mein Muhammad bin Khazim Abu Muawiyah aur A'mash mudallis hain. Jo ravi thiqah hai lekin wo mudallis hain aur 'an' se riwayat kar rahe hain, aur ye pet rule hai muhadditheen ka ke mudallis ki 'an' wali riwayat da'eef hoti hai jab tak sama' ki tasreeh maujood na ho. Lihaaza ye agla portion jis ko sahara bana kar Aap sallallahu alayhi wa sallam ki wafat ke baad bhi is tarah ki duaon ko istemal kiya ja raha hai wo ghalati par mabni hai. Wo portion hai hi da'eef, aur mudallis ki 'an' wali riwayat da'eef hoti hai."
    summary_en: "Argues that the narration of Malik al-Dar regarding seeking rain at the Prophet's grave is weak due to tadlees of Abu Muawiyah and al-A'mash narrating with 'an'."
    evidence_cited:
