    move_type: consistency
    quote: "Inhi ahadith ke rawion mein ek ravi Sayyiduna Umar bhi hain radiyallahu ta'ala anhu. Yani Sayyiduna Umar ko toh ye yaqeen tha ke maine Huzoor ki mubarak zindagi mein pyala pesh kiya aur ungliyan dakhil keen, toh Huzoor ki wafat ke baad qabr pe pyala le jate aur kehte Ya Rasool Allah haath mubarak bahar nikalein aur is mein daal dein taake paani ke chashme jari ho jayein. Lekin unko pata tha ye gustakhi hai, Huzoor sallallahu alayhi wa sallam barzakhi hayat ke sath zinda hain, ab aap ke sath communication hamari us tarah nahi ho sakti."
