    quote: "Farmate hain ke jaan lena chahiye ke ghair se is tarah istimdad karna ke us par mukammal aetemad ho aur usko Allah ki madad ka mazhar na samjha jaye, aisi madad ghair se haraam hai. Aur agar mehaz tawajjuh Allah ki taraf ho aur us bande ko Allah ki madad ka mazhar jaane toh farmate hain ye jo madad hai ye jaiz hai Allah ke bandon se."
    summary_en: "Cites Shah Abdul Aziz Dehlawi's Tafsir Fath al-Aziz distinguishing unlawful total reliance on creation from permissible assistance viewing creation as Allah's manifestation."
