    quote: "Sulayman alayhis salam ka ikhtiyar hai, Allah farmata hai... Ke humne hawa ko Sulayman alayhis salam ke tabe mein de diya, control mein de diya ke wo Sulayman ke hukm se chalti hai. Isa alayhis salam farmate hain ke main tumhare liye mitti se surat banata hoon aur us mein phoonk marta hoon toh Allah ke izn se parinda ban jati hai, aur main madarzaad andhon ko korhiyon ko shifa deta hoon. Ab ye jo tasarruf ki taqat hai Isa alayhis salam ke paas ye kisne di? Allah ne di."
