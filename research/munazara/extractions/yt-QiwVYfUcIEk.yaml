    move_type: burden
    quote: "Ab sawal ye hai ke jo zahiri zindagi mein Allah Ta'ala ne unko ata kiye the, jo Allah ne unko zindagi mein diye the, wo kya chheen liye hain? Unse chheen lene ki koi daleel in logon ke paas maujood hai? Ke agar zindagi mein maante hain ke zindagi mein the unke paas ye ikhtiyarat, ab sawal ye hai ke duniya se parda kar jane ke baad Allah ne chheen liye hain? Agar chheen liye hain toh daleel pesh karein! Agar Allah ne nahi chheene, is par daleel nahi hai, toh phir wo ikhtiyar unke paas unke duniya se parda kar jane ke baad bhi maujood hai."
