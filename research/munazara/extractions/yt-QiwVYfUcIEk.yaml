    quote: "Iska bilkul wazeh hai ke Nabi Paak sallallahu alayhi wa sallam se Allah Rabbul Izzat ne kahlwaya ke aap keh dijiye ke main zaati taur par nafe ka maalik nahi hoon. Toh ye bilkul wazeh hai ke maine toh ye bar-ha maratib baat kitni baar dohra di hai ke koi nabi, wali, paighambar, rasool zaati taur par kisi tasarruf aur ikhtiyar ke maalik nahi hain. Mas'ala hai Allah Rabbul Izzat ne unhein jo ikhtiyaraat ata farmaye."
