    move_type: support-chain
    quote: "Musannaf Ibn Abi Shaybah 2469... Aswad tabi'i kehte hain sallaytu ma'a Umara fa-lam yarfa yadayhi maine Hazrat Umar ke peeche namaz parhi Hazrat Umar namaz ke shuru ke alawa baqi maqam par raf-ul-yadain nahin karte the... Musannaf Ibn Abi Shaybah mein 2457 number... Kulayb bin Shihab kehte hain ke Maula Ali jab namaz parhte to namaz ke shuru mein to apne haathon ko uthate the thumma la ya'oodu phir poori namaz mein dobara raf-ul-yadain nahin karte the... Nasb al-Raya ki pehli jild safha 408 pe likhte hain wa huwa atharun sahihun... Mujahid tabi'i jo ke Abdullah bin Umar ke shagird hain... Umdat al-Qari Sharh Sahih al-Bukhari jild number 5 safha number 399 pe likhte hain rawahu bi-isnadin sahihin"
    summary_en: "Refutes the laziness slur by providing unbroken authentic chains of Sahaba and major Tabi'in: Umar (Musannaf 2469, sahih Tahawi), Ali (Musannaf 2457, sahih Zayla'i), Ibn Umar (Musannaf 2467, sahih Ayni), Sha'bi (Musannaf 2459), and the collective disciples of Ali and Ibn Mas'ud (Musannaf 2461), proving they abandoned it deliberately as established Sunnah."
    evidence_cited:
