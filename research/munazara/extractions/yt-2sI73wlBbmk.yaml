    quote: "ek aam dhoka jo log usko qabool kar lete hain woh ye hai ke raf-ul-yadain karne ki jo ahadees hain woh zyada hain aur na karne ki kam hain... Sahih Muslim mein Imam Muslim 3410 number hadees se lekar 3435 number hadees tak Mut'ah ke hawale se ahadees leke aaye hain taqreeban 26 ahadees Imam Muslim ne Sahih Muslim mein zikr ki hain... zyada karne ki jawaz ki hain aur kam na karne ki hain to kya zyada karne ki hain to karna shuru kar dein? Hargiz nahin humne dekhna hai ke rajih kaun si ahadees hain matrook aur mansookh kaun si hain"
