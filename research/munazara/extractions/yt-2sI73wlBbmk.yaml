    maps_to: FQ-EM-C05
    move_type: restrict-evidence
    quote: "Huzoor ne ye to nahin farmaya ke main Kitabullah aur Bukhari Muslim chhor ke ja raha hoon... ye jo hadees hai ye khud hadees Bukhari Muslim mein maujood nahin hai... ye hadees Imam Malik ki al-Muwatta mein balaghatan Imam Malik se aur al-Mustadrak alas-Sahihayn Imam Hakim ne hadees number 320... ab ye hadees khud Sahih Bukhari Muslim mein maujood nahin Kutub-e-Sittah mein maujood nahin hai jo ke hujjiat-e-hadees ki ek daleel hai"
    summary_en: "Refutes restricting the Sunnah to Bukhari and Muslim: points out that the Prophet's farewell command ('Kitabullah and my Sunnah' in Muwatta and Mustadrak 318) is itself not in Bukhari or Muslim, and that pre-Bukhari compilations (Muwatta, Musannaf Abd al-Razzaq, Musannaf Ibn Abi Shaybah) held the Sunnah prior to Bukhari."
    evidence_cited:
      - as_said: "Muwatta Imam Malik (Kitabullah wa Sunnatan-Nabi)"
        timestamp: "00:02:15"
      - as_said: "al-Mustadrak alas-Sahihayn by al-Hakim 318 / 320"
