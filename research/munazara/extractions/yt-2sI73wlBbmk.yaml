    side: ahl-e-sunnat
    kind: counter-question
    maps_to: CQ-33
    move_type: consistency
    quote: "Sahih Bukhari mein Imam Bukhari ne chaar maqamaat pe do Sahaba se hadees ko bayan kiya hai 224, 225, 226 aur 2471 number ahadees hain... ke Nabi alayhis salatu was salam ne kharay hoke peshab farmaya... na Bukhari mein na Muslim mein baith ke peshab karne ki ek bhi hadees maujood nahin... jab hum deegar ahadees ko utha kar dekhte hain to Jami at-Tirmidhi mein Imam Tirmidhi rahimahullah hadees number 12 leke aaye Sayyidah Aisha Siddiqah radiyallahu ta'ala anha se... uski tasdeeq na karna Huzoor ne hamesha baith kar peshab farmaya"
    summary_en: "Demonstrates that texts in Bukhari/Muslim do not automatically define operative Sunnah: Bukhari contains 4 narrations of urinating standing and zero of sitting, yet the Ummah follows Aisha's narration in Tirmidhi 12 (sitting); similarly, Bukhari has 3 narrations of drinking water standing, while Muslim (5275-5279) strictly forbids it."
    evidence_cited:
      - as_said: "Sahih Bukhari 224, 225, 226, 2471 (urinating standing)"
        timestamp: "00:05:05"
      - as_said: "Jami at-Tirmidhi 12 (Aisha: 'never urinated except sitting')"
        timestamp: "00:05:55"
      - as_said: "Sahih Bukhari 5615, 5616, 5617 (drinking water standing)"
        timestamp: "00:08:05"
      - as_said: "Sahih Muslim 5275-5279 (prohibition of drinking standing)"
        timestamp: "00:08:45"
    responds_to: M01
    confidence: high

