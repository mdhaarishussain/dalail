    quote: "Mirza Jhelumi ek aur dhoka ye deta hai ke siwaye Hanafiyon ke baqi saari ummat unka mauqif yahi hai ke namaz mein raf-ul-yadain karna hai jabke Mirza Jhelumi ka ye bilkul jhoot hai... Imam Malik rahmatullahi ta'ala alayh ka mauqif unki fiqh ki jo mo'tabar kitab jisko Mirza Jhelumi mo'tabar aur mustanad tasleem kar chuka hai ye al-Mudawwanah al-Kubra... pehli jild ke safha 118 mein maujood hai la a'rifu raf'al-yadayni fee shay'in min takbeeris-salat illa fee iftitahis-salat... wa ra'ful-yadayni inda Malikin da'eefun illa fee takbeeratil-ihram"
    summary_en: "Dismantles Mirza's claim that all madhhabs agree on 4 raf al-yadayn except Hanafis, citing Imam Malik's foundational text al-Mudawwanah al-Kubra (1/118) where Malik explicitly declared raf al-yadayn outside opening takbeer to be unknown and weak."
