    quote: "Sayyiduna Hudhayfah radiyallahu ta'ala anhu farmate hain ke ek din main apni walidah ko ye keh ke aaya tha ke ammi jaan aaj main Maghrib ki namaz apne Aaqa ke peeche padhoonga... aur Sarkar ki bargah mein arz karoonga: Ya Rasool Allah, mere liye aur meri ammi ke liye bakhshish ki dua farmayein... Farmate hain jis waqt main Huzoor ke peeche peeche ja raha tha, abhi maine aake bataya nahi ke main kis maqsad ke liye aaya hoon. Huzoor ki bargah mein arz nahi kiya ke main Huzoor kya lene ke liye aaya hoon."
    summary_en: "Relates from Jami al-Tirmidhi that Hudhayfah intended in his heart to request prayers for forgiveness for himself and his mother without expressing it aloud."
