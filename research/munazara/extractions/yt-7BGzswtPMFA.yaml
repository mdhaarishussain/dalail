  - move_id: M05
    timestamp: "00:15:05-00:16:15"
    speaker: Mirza
    side: ali-mirza
    kind: claim
    reported: false
    move_type: definition
    quote: "Aalim-o-Nazir, ilm wala aur dekhne wala. Hazir ka lafz istemal karein ge toh is mein phir wo bad-aqeedagi ki boo aati hai jo hama-oost ka aqeedah hai, pantheism ka aqeedah, wahdat-ul-wujood ka aqeedah... Allah Ta'ala apni shaan ke la'iq apne Arsh par mustawi hai aur wahan hote hue bhi hamari rag-e-jaan se zyada qareeb hai, isliye Aalim-o-Nazir lafz istemal kiya jaye."
    summary_en: "Argues that even for Allah, the term 'Hazir' should not be used because it suggests physical presence in every particle (pantheism/wahdat-ul-wujud), advocating 'Aalim-o-Nazir' instead since Allah is established over the Throne."
