    quote: "Pul Sirat se pehle jo jo bhi Musalmanon ke firqe hain khwah wo kafir the, gumrah the, bid'ati the, sab ke sab namazein padhte the, unki tafreeq nahi hogi, a'za-e-wuzu chamak rahe hon ge... Baat ye discuss ho rahi thi ke Pul Sirat ka maqsad ye hai ke Musalmanon mein jo chupe hue munafiqeen hain jo ahl-e-qibla, ahl-e-kalima the. Kya Qadiani ahl-e-qibla, ahl-e-kalima nahi hain? Usi qiblay ki taraf namaz padhte hain, ahl-e-kalima bhi hain wo. Waise wo Ghulam Ahmad Qadiani ko Rasoolullah nahi kehte, ummati nabi kehte hain, kalima wo yahi padhte hain: Muhammadur Rasoolullah."
