counter_questions:
  - id: CQ-06
    topic: IS
    summary_en: "Asks how the opponent reconciles equating every vocative call with worship when the Quran uses the root d-'-w for the Prophet calling believers (3:153), believers calling each other (24:63), and Ibrahim calling dead birds (2:260)."
    used_in:
      - "yt-hqDt_1BwzLc#M07"
      - "yt-hqDt_1BwzLc#M09"
      - "yt-f5D6zj2Kr6Y#M07"

  - id: CQ-07
    topic: IS
    summary_en: "Asks why physical postures (standing, sitting on knees) are evaluated by intention and relationship (worship in namaz vs respect for parents or teachers), but verbal calling is treated as intrinsic worship regardless of belief."
    used_in:
      - "yt-hqDt_1BwzLc#M12"

  - id: CQ-08
    topic: IS
    summary_en: "Asks how calling unseen beings for assistance can be permitted in a wilderness/desert but classified as shirk in a town or city, asking whether location can alter the theological status of an action."
    used_in:
      - "yt-3-tML7NbATk#M13"

  - id: CQ-09
    topic: IS
    summary_en: "Asks whether Asif ibn Barkhiya bringing the throne of Bilqis before the blink of an eye was accomplished through physical means (ma taht al-asbab) or spiritual power granted by Allah (ma fawq al-asbab)."
    used_in:
      - "yt-hqDt_1BwzLc#M04"
      - "yt-vMA-Vcng63I#M03"
      - "yt-f5D6zj2Kr6Y#M05"

  - id: CQ-10
    topic: IS
    summary_en: "Asks why the Sahih Bukhari Hadith of Intercession uses the exact term istighatha for all mankind going to Adam, then Musa, then Muhammad in distress if calling upon created beings for aid were inherently shirk."
    used_in:
      - "yt-f5D6zj2Kr6Y#M06"

sequences:
  - topic: IS
    order: "IS-EM-C01 -> Quranic root d-'-w scope (CQ-06) -> al-du'a specified as du'a-ullah with uluhiyyah -> Sahaba precedent (Umar calling Sariyah, Ibn Umar calling Ya Muhammad) -> Posture analogy (CQ-07) -> Day of Judgment istighatha in Bukhari (CQ-10)"
  - topic: IS
    order: "IS-EM-C05 -> Zati vs Ata'i / Haqeeqi vs Majazi in Quran (Maryam 19, Nazi'at 5, Zumar 42) -> Asif ibn Barkhiya beyond causes (CQ-09) -> Hawazin seeking help through Prophet in Sunan an-Nasa'i -> Hadith Ya Ibad Allah A'inuni -> Restriction to jungles (IS-EM-C02) -> Geographic consistency counter-question (CQ-08) -> Turnabout citations (Ahmad, Nawawi, Ibn Taymiyyah, Nawab Siddiq Hasan Khan)"
  - topic: TW
    order: "TW-EM-C05 -> Blind man hadith restricted to lifetime (TW-EM-C01) -> Chain criticism on post-death narration (TW-EM-C02) -> Chain criticism on Malik al-Dar (TW-EM-C06) -> Umar seeking rain through Abbas (TW-EM-C03) -> Argument from absence of cup at grave (TW-EM-C07) -> Argument from Khaybar vs Hamza (IS-EM-C06)"

