  - id: IS-EM-C04
    legacy_id: EM-C04
    topic: IS
    opponent: EM
    summary_en: "Argues that even if Allah had granted authority (ikhtiyar) to prophets or saints, calling on them for help remains impermissible shirk, because righteous figures never directed invocations to other than Allah."
    move_type: principle
    stated_in:
      - "yt-0LqCS-zvCxY@00:02:15"
    reported_in: []
    answered_in: []
    counter_questions: []

  - id: IS-EM-C05
    legacy_id: EM-C05
    topic: IS
    opponent: EM
    summary_en: "Argues that calling upon someone in the unseen (ghaib) or beyond normal physical causality (ma fawq al-asbab) is worship and shirk, whereas asking someone present within normal causality (ma taht al-asbab) is permissible."
    move_type: definition
    stated_in:
      - "yt-0LqCS-zvCxY@00:00:48"
    reported_in:
