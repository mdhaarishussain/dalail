      - "CQ-07"

  - id: IS-EM-C02
    legacy_id: EM-C02
    topic: IS
    opponent: EM
    summary_en: "Argues that the hadith of calling unseen beings ('Ya Ibad Allah A'inuni') applies strictly to lost travelers in desolated wilderness/jungles (referring to terrestrial angels) and cannot justify istighatha in cities."
