  - id: IS-EM-C01
    legacy_id: EM-C01
    topic: IS
    opponent: EM
    summary_en: "Argues that du'a is worship exclusive to Allah; therefore, any direct vocative call to other than Allah ('Ya Rasool Allah madad', 'Ya Ali madad') is worship directed to creation, which is shirk."
    move_type: principle
    stated_in:
