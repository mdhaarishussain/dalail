counter_questions:
  - id: CQ-06
    topic: IS
    summary_en: "Asks how the opponent reconciles equating every vocative call with worship when the Quran uses the root d-'-w for the Prophet calling believers (3:153), believers calling each other (24:63), and Ibrahim calling dead birds (2:260)."
    used_in:
      - "yt-hqDt_1BwzLc#M07"
      - "yt-hqDt_1BwzLc#M09"
      - "yt-f5D6zj2Kr6Y#M07"

  - id: CQ-07
    topic: IS
    summary_en: "Asks why physical postures (standing, sitting on knees) are evaluated by intention and relationship (worship in namaz vs respect for parents or teachers), but verbal calling is treated as intrinsic worship regardless of belief."
    used_in:
      - "yt-hqDt_1BwzLc#M12"

  - id: CQ-08
    topic: IS
    summary_en: "Asks how calling unseen beings for assistance can be permitted in a wilderness/desert but classified as shirk in a town or city, asking whether location can alter the theological status of an action."
    used_in:
      - "yt-3-tML7NbATk#M13"

  - id: CQ-09
    topic: IS
    summary_en: "Asks whether Asif ibn Barkhiya bringing the throne of Bilqis before the blink of an eye was accomplished through physical means (ma taht al-asbab) or spiritual power granted by Allah (ma fawq al-asbab)."
    used_in:
      - "yt-hqDt_1BwzLc#M04"
      - "yt-vMA-Vcng63I#M03"
      - "yt-f5D6zj2Kr6Y#M05"

  - id: CQ-10
    topic: IS
    summary_en: "Asks why the Sahih Bukhari Hadith of Intercession uses the exact term istighatha for all mankind going to Adam, then Musa, then Muhammad in distress if calling upon created beings for aid were inherently shirk."
    used_in:
      - "yt-f5D6zj2Kr6Y#M06"

  - id: CQ-11
    topic: IK
    summary_en: "Asks opponents to produce any textual proof from the Quran or Sunnah demonstrating that the spiritual authority, control (tasarruf), and miracles granted to prophets during their earthly lives were revoked or stripped away by Allah after their passing into barzakh."
    used_in:
      - "yt-QiwVYfUcIEk#M04"

  - id: CQ-12
    topic: KR
    summary_en: "Asks how the opponent can argue on one hand that Khalid bin Waleed could never perform an action alleged to be contrary to Shariah to dismiss a sound karamat, while simultaneously accusing other Sahaba (such as Muawiyah and Amr ibn al-Aas) of actions contrary to Shariah in historical conflicts."
    used_in:
      - "yt-jhP_dOsZ2g4#M07"

  - id: CQ-13
    topic: TS
    summary_en: "Asks whether the traveler who in extreme joy mistakenly declared 'Allahumma anta 'abdi wa ana rabbuka' (Sahih Muslim) was declared a kafir by the Prophet, and why classical jurists withhold takfir from words uttered during loss of cognitive control (shiddat-e-farah or sukr)."
    used_in:
      - "yt-knUP0hRf7tk#M04"

  - id: CQ-14
    topic: TS
    summary_en: "Asks how an ecstatic story can be used for takfir when different historical malfuzat attribute the exact same incident to three different people (Moinuddin Chishti, Bakhtiar Kaki, and Yusuf Chishti), demonstrating manuscript unreliability and interpolation (ilhaq)."
    used_in:
      - "yt-knUP0hRf7tk#M05"

sequences:
  - topic: IS
    order: "IS-EM-C01 -> Quranic root d-'-w scope (CQ-06) -> al-du'a specified as du'a-ullah with uluhiyyah -> Sahaba precedent (Umar calling Sariyah, Ibn Umar calling Ya Muhammad) -> Posture analogy (CQ-07) -> Day of Judgment istighatha in Bukhari (CQ-10)"
  - topic: IS
    order: "IS-EM-C05 -> Zati vs Ata'i / Haqeeqi vs Majazi in Quran (Maryam 19, Nazi'at 5, Zumar 42) -> Asif ibn Barkhiya beyond causes (CQ-09) -> Hawazin seeking help through Prophet in Sunan an-Nasa'i -> Hadith Ya Ibad Allah A'inuni -> Restriction to jungles (IS-EM-C02) -> Geographic consistency counter-question (CQ-08) -> Turnabout citations (Ahmad, Nawawi, Ibn Taymiyyah, Nawab Siddiq Hasan Khan)"
  - topic: TW
    order: "TW-EM-C05 -> Blind man hadith restricted to lifetime (TW-EM-C01) -> Chain criticism on post-death narration (TW-EM-C02) -> Chain criticism on Malik al-Dar (TW-EM-C06) -> Umar seeking rain through Abbas (TW-EM-C03) -> Argument from absence of cup at grave (TW-EM-C07) -> Argument from Khaybar vs Hamza (IS-EM-C06) -> Graveside greeting vs distant calling (TW-EM-C08)"
  - topic: IG
    order: "IG-WH-C01 / IG-EM-C01 -> Negation of absolute unseen knowledge (6:50, 7:188) -> Five keys of unseen (31:34) (IG-EM-C02) -> Bi'r Ma'oonah lack of foreknowledge (IG-EM-C03) -> Surah At-Tahrim 3 attribution to divine reporting (IG-EM-C04) -> Vision of Bayt al-Maqdis (IG-EM-C05) -> Sunni counter from Hadith of Mi'raj (alimtu ma fis-samawat) and reading unspoken hearts (Tabarani, Ahmad, Tirmidhi)"
  - topic: IK
    order: "IK-EM-C01 (Quran 72:21, 7:188 negation of benefit/harm) -> Sunni distinguishes Zaati vs Ata'i (wind for Sulayman, healing for Isa) -> Opponent restricts authority to physical lifetime -> Sunni counter-question: Did Allah strip away granted powers after passing? (CQ-11)"
  - topic: KR
    order: "KR-EM-C01 / KR-EM-C02 (Khalid poison suicide charge & Haythami attack) -> Sunni cites Fath al-Bari, Umdat al-Qari, Siyar A'lam al-Nubala -> Sunni proves continuous chain through Qays ibn Abi Hazim -> Opponent claims karamat is khilaf-e-aql / laws unbroken (KR-EM-C04, KR-EM-C05) -> Sunni defines khariq-e-aadat vs muhal aqli (Lalaka'i, Baqillani, Ibn Taymiyyah) -> Sunni consistency counter-question on Sahaba (CQ-12)"
  - topic: NB
    order: "NB-EM-C01 (Accusation of God-chunk heresy) -> Sunni cites Fatawa Razawiyyah ruling God-chunk belief and bashariyyat denial as kufr -> NB-EM-C02 (Musannaf Abdur Razzaq manuscript attack) -> Sunni reads Habib al-Rahman al-A'zami preface confirming missing opening chapter -> Pre-print citations (Qastallani, Thanvi, Halabi, Ibn al-Jawzi)"
  - topic: TS
    order: "TS-EM-C01 / TS-EM-C02 (Chishti Rasool Allah takfir charge) -> Sunni rejects phrase correctness -> Turnabout: Mirza excused Khwaja on same historical ground -> Shathiyyat rule: desert traveler in Sahih Muslim (CQ-13) -> Conflicting attributions in malfuzat (CQ-14) -> Fatawa Razawiyyah ruling on ilhaqaat and takfir for claiming prophethood"

