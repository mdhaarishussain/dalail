  CQ-04: "Kasb vs Khalq in Mu'jizat and Karamat"
  CQ-05: "Surah an-Naml 27:38-40 (Asif ibn Barkhiya transporting throne)"
  CQ-06: "Linguistic and Quranic scope of root d-'-w (Surah 3:153, 24:63, 2:260)"
  CQ-07: "Physical posture and gesture analogy (Hadith Jibril vs Shirk)"
  CQ-08: "Geographic consistency on Shirk (Wilderness vs Populated city)"
  CQ-09: "Physical causality in miracles (Transportation without spatial travel)"
  CQ-10: "Bukhari Intercession Hadith using explicit root gh-w-th to Prophets"
  CQ-11: "Cessation of granted spiritual power after barzakh passing"
  CQ-12: "Consistency on Sahaba committing actions contrary to Shariah norms"
  CQ-13: "Desert traveler ecstatic speech (akhta'a min shiddatil-farah) vs Takfir"
  CQ-14: "Conflicting historical attributions across Chishti malfuzat literature"
  CQ-15: "Divine communication vs Finality: Wahi to Isa upon descent (Muslim 7373)"
  CQ-16: "Selective adherence to Malik bin al-Huwayrith (Ruku vs Sujud Raf al-Yadayn)"
  CQ-17: "Turnabout on Ghunyat al-Talibeen (Hands below navel in Hanbali fiqh)"
  CQ-18: "Turnabout on Abu Hanifa vs Ibn Mubarak (Raf al-Yadayn at every takbeer)"
  CQ-19: "Burden of proof for abandoning Sujud Raf al-Yadayn while retaining Ruku"
  CQ-20: "Consistency on Khatam-e-Nabuwwat (Condemning Sufi kashf vs Defending Mukhtar al-Thaqafi)"
